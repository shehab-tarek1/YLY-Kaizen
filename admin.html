<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة كايزن YLY - Kaizen OS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#002060', ylyred: '#E30613' },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out', 'slide-in': 'slideIn 0.3s ease-out' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideIn: { '0%': { transform: 'translateX(20px)', opacity: 0 }, '100%': { transform: 'translateX(0)', opacity: 1 } }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #F0F4F8; font-family: system-ui, -apple-system, sans-serif; }
        .spinner { width: 1.2rem; height: 1.2rem; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .75s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Custom Scrollbar for Kanban */
        .kanban-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .kanban-scroll::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 4px; }
        .kanban-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ path, size=20, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: path }} />
        );
        const ICONS = {
            Board: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>',
            Analytics: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
            Check: '<polyline points="20 6 9 17 4 12"/>',
            X: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
            TrendingUp: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>'
        };

        const firebaseConfig = {
            apiKey: "AIzaSyA3UqEDpP2Llt7ZkloqmlURGULdKEiWF3o",
            authDomain: "yly-2026.firebaseapp.com",
            projectId: "yly-2026",
            storageBucket: "yly-2026.firebasestorage.app",
            messagingSenderId: "599868603298",
            appId: "1:599868603298:web:f66010961895c707cb10fb"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const COMMITTEES = ['HR', 'PR', 'Media', 'OR', 'Events', 'Logistics', 'Communication', 'Training', 'Other'];
        
        // المراحل الحقيقية للكايزن
        const STAGES = [
            { id: 'submitted', label: 'مُقدمة', color: 'bg-slate-200' },
            { id: 'under_review', label: 'مراجعة', color: 'bg-blue-200' },
            { id: 'approved', label: 'مقبولة', color: 'bg-amber-200' },
            { id: 'experiment', label: 'جاري التجربة', color: 'bg-orange-200' },
            { id: 'measuring', label: 'قياس', color: 'bg-teal-200' },
            { id: 'implemented', label: 'تم التنفيذ', color: 'bg-emerald-300' },
            { id: 'standardized', label: 'تعميم (Standard)', color: 'bg-purple-300' },
            { id: 'rejected', label: 'مرفوضة', color: 'bg-red-200' }
        ];

        function AdminApp() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('kanban'); // kanban, analytics
            const [ideas, setIdeas] = useState([]);
            const [toast, setToast] = useState(null);
            
            // Modal States
            const [selectedIdea, setSelectedIdea] = useState(null);
            const [actionType, setActionType] = useState(null); // 'move_to_experiment', 'move_to_implement'
            const [experimentData, setExperimentData] = useState({ duration: 'أسبوع', kpi: '' });
            const [resultsData, setResultsData] = useState({ before: '', after: '' });

            const showToast = (msg, type='success') => { setToast({msg, type}); setTimeout(() => setToast(null), 3000); };

            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(u => {
                    setUser(u);
                    if (!u) setLoading(false);
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubIdeas = db.collection('ideas').orderBy('createdAt', 'desc').onSnapshot(snap => {
                    setIdeas(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });
                return () => unsubIdeas();
            }, [user]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch(err) {
                    showToast('بيانات الدخول غير صحيحة', 'error');
                }
                setLoading(false);
            };

            // تغيير حالة الفكرة
            const changeIdeaStatus = async (ideaId, newStatus) => {
                try {
                    let updatePayload = { status: newStatus };
                    
                    if (newStatus === 'experiment') {
                        if(!experimentData.kpi) return showToast('برجاء كتابة مؤشر القياس', 'error');
                        updatePayload.experimentPlan = experimentData;
                    }
                    if (newStatus === 'implemented') {
                        if(!resultsData.before || !resultsData.after) return showToast('برجاء إدخال الأرقام للقياس', 'error');
                        const b = parseFloat(resultsData.before);
                        const a = parseFloat(resultsData.after);
                        // معادلة حساب نسبة التحسن (بافتراض أن تقليل الرقم هو التحسن كتقليل الوقت/التكلفة)
                        const improvement = (((b - a) / b) * 100).toFixed(1);
                        updatePayload.results = { before: b, after: a, improvementPercentage: improvement };
                    }

                    await db.collection('ideas').doc(ideaId).update(updatePayload);
                    showToast('تم تحديث مسار الفكرة بنجاح');
                    setSelectedIdea(null);
                    setActionType(null);
                    setExperimentData({ duration: 'أسبوع', kpi: '' });
                    setResultsData({ before: '', after: '' });
                } catch (e) { showToast('حدث خطأ', 'error'); }
            };

            const openActionModal = (idea, targetStatus) => {
                if(targetStatus === 'experiment') setActionType('move_to_experiment');
                else if(targetStatus === 'implemented') setActionType('move_to_implement');
                else changeIdeaStatus(idea.id, targetStatus); // للخطوات العادية
            };

            // Analytics Calculations
            const stats = useMemo(() => {
                const total = ideas.length || 1; // avoid division by zero
                const implemented = ideas.filter(i => i.status === 'implemented' || i.status === 'standardized').length;
                const standardized = ideas.filter(i => i.status === 'standardized').length;
                
                const committeeCount = {};
                COMMITTEES.forEach(c => committeeCount[c] = 0);
                ideas.forEach(i => { if(committeeCount[i.category] !== undefined) committeeCount[i.category]++; });

                return {
                    total: ideas.length,
                    implementationRate: ((implemented / total) * 100).toFixed(0),
                    standardizationRate: ((standardized / total) * 100).toFixed(0),
                    committeeCount
                };
            }, [ideas]);

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-navy">
                        <form onSubmit={handleLogin} className="bg-white p-8 rounded-3xl w-full max-w-sm shadow-2xl animate-fade-in">
                            <h1 className="text-2xl font-black text-navy text-center mb-1">لوحة الإدارة - Kaizen</h1>
                            <p className="text-xs font-bold text-slate-400 text-center mb-6">خاص بقادة الفرق والإدارة فقط</p>
                            <div className="space-y-4">
                                <input type="email" placeholder="البريد الإلكتروني للإدارة" required value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-navy" />
                                <input type="password" placeholder="كلمة المرور" required value={password} onChange={e=>setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-navy" />
                                <button type="submit" disabled={loading} className="w-full bg-ylyred hover:bg-red-700 text-white font-bold py-3 rounded-xl transition-all shadow-md flex justify-center items-center">
                                    {loading ? <span className="spinner"></span> : 'تسجيل الدخول'}
                                </button>
                            </div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-[#F0F4F8]">
                    {toast && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-2.5 rounded-full text-white text-sm font-bold shadow-lg animate-fade-in ${toast.type==='error'?'bg-red-500':'bg-navy'}`}>
                            {toast.msg}
                        </div>
                    )}

                    {/* Navbar */}
                    <header className="bg-white px-6 py-3 flex justify-between items-center shadow-sm z-10 border-b border-slate-200">
                        <div className="flex items-center gap-3">
                            <h1 className="font-black text-navy text-xl">Kaizen <span className="text-ylyred">OS</span> Admin</h1>
                            <div className="hidden md:flex bg-slate-100 rounded-lg p-1 gap-1 mr-6">
                                <button onClick={()=>setActiveTab('kanban')} className={`px-4 py-1.5 rounded-md text-sm font-bold flex items-center gap-1 ${activeTab==='kanban'?'bg-white text-navy shadow-sm':'text-slate-500'}`}><Icon path={ICONS.Board} size={16}/> مسار الأفكار</button>
                                <button onClick={()=>setActiveTab('analytics')} className={`px-4 py-1.5 rounded-md text-sm font-bold flex items-center gap-1 ${activeTab==='analytics'?'bg-white text-navy shadow-sm':'text-slate-500'}`}><Icon path={ICONS.Analytics} size={16}/> التحليلات والأداء</button>
                            </div>
                        </div>
                        <button onClick={() => auth.signOut()} className="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100">تسجيل الخروج</button>
                    </header>

                    {/* Mobile Tabs */}
                    <div className="md:hidden flex bg-white border-b border-slate-200 p-2 gap-2">
                        <button onClick={()=>setActiveTab('kanban')} className={`flex-1 py-2 rounded-lg text-xs font-bold flex justify-center items-center gap-1 ${activeTab==='kanban'?'bg-navy text-white':'bg-slate-50 text-slate-500'}`}><Icon path={ICONS.Board} size={14}/> مسار الأفكار</button>
                        <button onClick={()=>setActiveTab('analytics')} className={`flex-1 py-2 rounded-lg text-xs font-bold flex justify-center items-center gap-1 ${activeTab==='analytics'?'bg-navy text-white':'bg-slate-50 text-slate-500'}`}><Icon path={ICONS.Analytics} size={14}/> التحليلات</button>
                    </div>

                    {/* Main Content */}
                    <main className="flex-1 overflow-hidden relative">
                        
                        {/* 1. KANBAN BOARD VIEW */}
                        {activeTab === 'kanban' && (
                            <div className="h-full w-full overflow-x-auto kanban-scroll flex items-start gap-4 p-4 md:p-6 pb-8">
                                {STAGES.filter(s => s.id !== 'rejected').map(stage => (
                                    <div key={stage.id} className="bg-slate-100 rounded-2xl p-3 min-w-[280px] w-[280px] flex-shrink-0 flex flex-col h-[calc(100vh-140px)] border border-slate-200">
                                        <div className="flex justify-between items-center mb-3 px-1">
                                            <h3 className="font-black text-sm text-slate-700 flex items-center gap-2">
                                                <span className={`w-3 h-3 rounded-full ${stage.color}`}></span>
                                                {stage.label}
                                            </h3>
                                            <span className="bg-slate-200 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-full">{ideas.filter(i=>i.status === stage.id).length}</span>
                                        </div>
                                        
                                        <div className="flex-1 overflow-y-auto pr-1 space-y-3 kanban-scroll">
                                            {ideas.filter(i=>i.status === stage.id).map(idea => (
                                                <div key={idea.id} onClick={() => setSelectedIdea(idea)} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:border-navy transition-colors animate-slide-in">
                                                    <h4 className="font-bold text-navy text-xs leading-relaxed mb-1">{idea.title}</h4>
                                                    <div className="flex justify-between items-end mt-3">
                                                        <div>
                                                            <p className="text-[10px] font-bold text-slate-400">{idea.author}</p>
                                                            <p className="text-[9px] font-bold text-ylyred bg-red-50 px-1.5 py-0.5 rounded inline-block mt-0.5">{idea.category}</p>
                                                        </div>
                                                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${idea.expectedImpact === 'High' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-slate-50 text-slate-500 border-slate-100'}`}>
                                                            تأثير: {idea.expectedImpact}
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                            {ideas.filter(i=>i.status === stage.id).length === 0 && (
                                                <div className="h-20 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-center">
                                                    <span className="text-xs font-bold text-slate-400">لا يوجد أفكار</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 2. ANALYTICS DASHBOARD VIEW */}
                        {activeTab === 'analytics' && (
                            <div className="h-full overflow-y-auto p-4 md:p-8 kanban-scroll animate-fade-in">
                                <div className="max-w-5xl mx-auto space-y-6">
                                    <h2 className="text-xl font-black text-navy">لوحة قياس أداء الكايزن (KPIs)</h2>
                                    
                                    {/* Top Stats */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                            <p className="text-xs font-bold text-slate-500 mb-1">إجمالي الأفكار</p>
                                            <p className="text-3xl font-black text-navy">{stats.total}</p>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                            <p className="text-xs font-bold text-slate-500 mb-1">نسبة التنفيذ (Implementation)</p>
                                            <p className="text-3xl font-black text-emerald-600">{stats.implementationRate}%</p>
                                            <p className="text-[10px] text-slate-400 mt-1">من الأفكار وصلت للتنفيذ</p>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                            <p className="text-xs font-bold text-slate-500 mb-1">نسبة التعميم (Standardization)</p>
                                            <p className="text-3xl font-black text-purple-600">{stats.standardizationRate}%</p>
                                            <p className="text-[10px] text-slate-400 mt-1">من الأفكار أصبحت Standard</p>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                            <p className="text-xs font-bold text-slate-500 mb-1">الأفكار قيد التجربة</p>
                                            <p className="text-3xl font-black text-orange-500">{ideas.filter(i=>i.status==='experiment' || i.status==='measuring').length}</p>
                                        </div>
                                    </div>

                                    {/* Chart: Ideas per Committee */}
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <h3 className="text-sm font-black text-navy mb-4">أداء اللجان (الأفكار المقدمة)</h3>
                                        <div className="space-y-3">
                                            {Object.entries(stats.committeeCount).sort((a,b)=>b[1]-a[1]).map(([committee, count]) => {
                                                const percentage = stats.total > 0 ? (count / stats.total) * 100 : 0;
                                                return (
                                                    <div key={committee} className="flex items-center gap-3">
                                                        <span className="w-24 text-xs font-bold text-slate-600 shrink-0">{committee}</span>
                                                        <div className="flex-1 bg-slate-100 h-4 rounded-full overflow-hidden">
                                                            <div className="bg-navy h-full rounded-full" style={{width: `${percentage}%`}}></div>
                                                        </div>
                                                        <span className="w-8 text-xs font-black text-navy text-left">{count}</span>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* --- IDEA DETAILS MODAL & ACTION WORKFLOW --- */}
                    {selectedIdea && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl animate-slide-in overflow-hidden">
                                
                                {/* Modal Header */}
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-start bg-slate-50">
                                    <div>
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1 block">إدارة الفكرة</span>
                                        <h2 className="text-lg font-black text-navy leading-tight">{selectedIdea.title}</h2>
                                        <p className="text-xs font-bold text-slate-500 mt-1">بواسطة: {selectedIdea.author} ({selectedIdea.category})</p>
                                    </div>
                                    <button onClick={() => { setSelectedIdea(null); setActionType(null); }} className="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-sm text-slate-400 hover:text-red-500"><Icon path={ICONS.X}/></button>
                                </div>

                                {/* Modal Body */}
                                <div className="flex-1 overflow-y-auto p-6 space-y-5 kanban-scroll">
                                    
                                    {/* الأساسيات */}
                                    {!actionType && (
                                        <>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="bg-red-50/50 p-4 rounded-2xl border border-red-100">
                                                    <h4 className="text-xs font-black text-ylyred mb-1">الوضع الحالي (المشكلة)</h4>
                                                    <p className="text-xs text-slate-700 font-medium">{selectedIdea.currentProcess}</p>
                                                </div>
                                                <div className="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                                                    <h4 className="text-xs font-black text-blue-600 mb-1">الحل المقترح (الكايزن)</h4>
                                                    <p className="text-xs text-slate-700 font-medium">{selectedIdea.solution}</p>
                                                </div>
                                            </div>

                                            {/* عرض بيانات التجربة والقياس إذا وجدت */}
                                            {selectedIdea.experimentPlan && (
                                                <div className="bg-orange-50 p-4 rounded-2xl border border-orange-200">
                                                    <h4 className="text-xs font-black text-orange-700 mb-2">خطة التجربة المعتمدة</h4>
                                                    <p className="text-xs text-slate-700 font-bold">المؤشر (KPI): <span className="font-medium">{selectedIdea.experimentPlan.kpi}</span></p>
                                                    <p className="text-xs text-slate-700 font-bold mt-1">المدة: <span className="font-medium">{selectedIdea.experimentPlan.duration}</span></p>
                                                </div>
                                            )}
                                            {selectedIdea.results && (
                                                <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 flex items-center justify-between">
                                                    <div>
                                                        <h4 className="text-xs font-black text-emerald-700 mb-1">نتائج القياس الفعلي</h4>
                                                        <p className="text-xs text-slate-600 font-bold">تم خفض الرقم من {selectedIdea.results.before} إلى {selectedIdea.results.after}</p>
                                                    </div>
                                                    <div className="bg-emerald-600 text-white font-black text-sm px-3 py-1.5 rounded-lg shadow-sm">
                                                        تحسن {selectedIdea.results.improvementPercentage}%
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}

                                    {/* Action Forms (The Kaizen OS Magic) */}
                                    {actionType === 'move_to_experiment' && (
                                        <div className="bg-orange-50 p-5 rounded-2xl border border-orange-200 animate-fade-in">
                                            <h3 className="font-black text-orange-700 mb-3 flex items-center gap-2"><Icon path={ICONS.TrendingUp} size={18}/> بدء خطة التجربة (Experiment)</h3>
                                            <p className="text-xs text-slate-600 font-medium mb-4">يجب تحديد مؤشر أداء واضح لقياس نجاح هذه الفكرة قبل تعميمها.</p>
                                            
                                            <label className="text-[11px] font-black text-slate-700 block mb-1">ما هو الـ KPI المستهدف؟ (مثال: وقت تسجيل الحضور بالدقائق)</label>
                                            <input type="text" value={experimentData.kpi} onChange={e=>setExperimentData({...experimentData, kpi: e.target.value})} className="w-full bg-white border border-orange-200 px-3 py-2.5 rounded-xl text-xs font-bold outline-none focus:border-orange-500 mb-3" placeholder="مؤشر القياس..." />
                                            
                                            <label className="text-[11px] font-black text-slate-700 block mb-1">مدة التجربة</label>
                                            <select value={experimentData.duration} onChange={e=>setExperimentData({...experimentData, duration: e.target.value})} className="w-full bg-white border border-orange-200 px-3 py-2.5 rounded-xl text-xs font-bold outline-none focus:border-orange-500">
                                                <option value="أسبوع">أسبوع</option>
                                                <option value="أسبوعين">أسبوعين</option>
                                                <option value="شهر">شهر</option>
                                                <option value="حدث كامل (Event)">حدث كامل (Event)</option>
                                            </select>
                                        </div>
                                    )}

                                    {actionType === 'move_to_implement' && (
                                        <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-200 animate-fade-in">
                                            <h3 className="font-black text-emerald-700 mb-3 flex items-center gap-2"><Icon path={ICONS.Check} size={18}/> تسجيل نتائج القياس (Implementation)</h3>
                                            <p className="text-xs text-slate-600 font-medium mb-4">بناءً على الـ KPI ({selectedIdea.experimentPlan?.kpi || 'المحدد'})، أدخل الأرقام قبل وبعد الفكرة.</p>
                                            
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[11px] font-black text-red-600 block mb-1">الرقم قبل التجربة (Before)</label>
                                                    <input type="number" value={resultsData.before} onChange={e=>setResultsData({...resultsData, before: e.target.value})} className="w-full bg-white border border-emerald-200 px-3 py-2.5 rounded-xl text-xs font-bold outline-none" placeholder="مثال: 20" />
                                                </div>
                                                <div>
                                                    <label className="text-[11px] font-black text-emerald-600 block mb-1">الرقم بعد التجربة (After)</label>
                                                    <input type="number" value={resultsData.after} onChange={e=>setResultsData({...resultsData, after: e.target.value})} className="w-full bg-white border border-emerald-200 px-3 py-2.5 rounded-xl text-xs font-bold outline-none" placeholder="مثال: 8" />
                                                </div>
                                            </div>
                                            <p className="text-[10px] text-slate-500 font-bold mt-3 text-center">سيقوم النظام بحساب نسبة التحسن تلقائياً.</p>
                                        </div>
                                    )}
                                </div>

                                {/* Modal Actions (Bottom Bar) */}
                                <div className="px-6 py-4 bg-white border-t border-slate-100 flex flex-wrap gap-2 justify-end">
                                    {actionType ? (
                                        <>
                                            <button onClick={()=>setActionType(null)} className="px-4 py-2 bg-slate-100 text-slate-600 text-xs font-bold rounded-xl">إلغاء</button>
                                            <button onClick={() => changeIdeaStatus(selectedIdea.id, actionType==='move_to_experiment' ? 'experiment' : 'implemented')} className={`px-6 py-2 text-white text-xs font-bold rounded-xl shadow-sm ${actionType==='move_to_experiment'?'bg-orange-500':'bg-emerald-600'}`}>
                                                حفظ ونقل الفكرة
                                            </button>
                                        </>
                                    ) : (
                                        <>
                                            {selectedIdea.status === 'submitted' && <button onClick={()=>changeIdeaStatus(selectedIdea.id, 'under_review')} className="px-4 py-2 bg-blue-100 text-blue-700 text-xs font-bold rounded-xl">بدء المراجعة</button>}
                                            
                                            {selectedIdea.status === 'under_review' && <button onClick={()=>changeIdeaStatus(selectedIdea.id, 'approved')} className="px-4 py-2 bg-amber-100 text-amber-700 text-xs font-bold rounded-xl">موافقة مبدئية</button>}
                                            
                                            {selectedIdea.status === 'approved' && <button onClick={()=>openActionModal(selectedIdea, 'experiment')} className="px-4 py-2 bg-orange-500 text-white text-xs font-bold rounded-xl shadow-sm">تحديد خطة تجربة (Experiment)</button>}
                                            
                                            {selectedIdea.status === 'experiment' && <button onClick={()=>changeIdeaStatus(selectedIdea.id, 'measuring')} className="px-4 py-2 bg-teal-100 text-teal-700 text-xs font-bold rounded-xl">البدء في القياس</button>}
                                            
                                            {selectedIdea.status === 'measuring' && <button onClick={()=>openActionModal(selectedIdea, 'implemented')} className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow-sm">إدخال النتائج وتنفيذ</button>}
                                            
                                            {selectedIdea.status === 'implemented' && <button onClick={()=>changeIdeaStatus(selectedIdea.id, 'standardized')} className="px-4 py-2 bg-purple-600 text-white text-xs font-bold rounded-xl shadow-sm">تعميم في المكتبة (Standardize)</button>}

                                            {(selectedIdea.status === 'submitted' || selectedIdea.status === 'under_review') && (
                                                <button onClick={()=>changeIdeaStatus(selectedIdea.id, 'rejected')} className="px-4 py-2 bg-red-50 text-red-600 border border-red-100 text-xs font-bold rounded-xl mr-auto">رفض</button>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
