<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة كايزن YLY</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Auth & Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        .spinner { width: 1rem; height: 1rem; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .skeleton { background: linear-gradient(90deg, #edf2f7 25%, #f8fafc 37%, #edf2f7 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        input, select, button { outline: none !important; }
        input:focus-visible, select:focus-visible { border-color: #002060 !important; }
    </style>
</head>
<body class="bg-[#F0F5FA] font-sans text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyA3UqEDpP2Llt7ZkloqmlURGULdKEiWF3o",
            authDomain: "yly-2026.firebaseapp.com",
            projectId: "yly-2026",
            storageBucket: "yly-2026.firebasestorage.app",
            messagingSenderId: "599868603298",
            appId: "1:599868603298:web:f66010961895c707cb10fb"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const ADMIN_UID = "d4OliyrrEZbJiw1HkXUJ83rGzhq1";

        function AdminPanel() {
            const [authChecked, setAuthChecked] = useState(false);
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);
            const [ideas, setIdeas] = useState([]);
            const [ideasLoaded, setIdeasLoaded] = useState(false);
            const [error, setError] = useState('');
            const [busyId, setBusyId] = useState(null);
            const [search, setSearch] = useState('');
            const [statusFilter, setStatusFilter] = useState('الكل');
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 2400);
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(currentUser => {
                    if (currentUser && currentUser.uid === ADMIN_UID) {
                        setUser(currentUser);
                    } else {
                        setUser(null);
                        if (currentUser) auth.signOut();
                    }
                    setAuthChecked(true);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('ideas').orderBy('createdAt', 'desc').onSnapshot(
                    snapshot => {
                        setIdeas(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        setIdeasLoaded(true);
                    },
                    err => { console.error(err); setIdeasLoaded(true); showToast('تعذر تحميل الأفكار', 'error'); }
                );
                return () => unsubscribe();
            }, [user]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoginLoading(true);
                try {
                    const cred = await auth.signInWithEmailAndPassword(email.trim(), password);
                    if (cred.user.uid !== ADMIN_UID) {
                        setError('عفواً، حسابك ليس لديه صلاحيات الإدارة.');
                        await auth.signOut();
                    }
                } catch (err) {
                    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                        setError('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
                    } else {
                        setError('تعذر تسجيل الدخول، تحقق من البيانات وحاول لاحقاً.');
                    }
                } finally {
                    setLoginLoading(false);
                }
            };

            const updateStatus = async (id, newStatus) => {
                setBusyId(id);
                try {
                    await db.collection('ideas').doc(id).update({ status: newStatus });
                    showToast('تم تحديث الحالة بنجاح');
                } catch (err) {
                    console.error(err);
                    showToast('تعذر تحديث الحالة', 'error');
                } finally {
                    setBusyId(null);
                }
            };

            const deleteIdea = async (id) => {
                if (!window.confirm('هل أنت متأكد من الحذف النهائي لهذه الفكرة؟ لا يمكن التراجع.')) return;
                setBusyId(id);
                try {
                    await db.collection('ideas').doc(id).delete();
                    showToast('تم حذف الفكرة بنجاح');
                } catch (err) {
                    console.error(err);
                    showToast('تعذر حذف الفكرة', 'error');
                } finally {
                    setBusyId(null);
                }
            };

            const filteredIdeas = ideas.filter(idea => {
                const matchesStatus = statusFilter === 'الكل' || idea.status === statusFilter;
                const matchesSearch = !search.trim() || (idea.title || '').toLowerCase().includes(search.trim().toLowerCase()) || (idea.author || '').toLowerCase().includes(search.trim().toLowerCase());
                return matchesStatus && matchesSearch;
            });

            if (!authChecked) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <span className="spinner text-[#002060]" style={{width: '2rem', height: '2rem', borderWidth: '3px'}}></span>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <form onSubmit={handleLogin} className="bg-white p-6 md:p-8 rounded-2xl shadow-sm w-full max-w-sm border border-slate-200/70">
                            <div className="flex justify-center mb-4">
                                <div className="w-14 h-14 rounded-full overflow-hidden shadow-sm ring-1 ring-slate-200 bg-[#001845]">
                                    <img src="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png" alt="YLY" className="w-full h-full object-cover scale-125" />
                                </div>
                            </div>
                            <h2 className="text-lg md:text-xl font-black text-[#002060] text-center mb-4">لوحة إدارة كايزن YLY</h2>
                            {error && <div role="alert" className="bg-red-50 text-[#E30613] p-2.5 rounded-xl text-xs font-bold text-center mb-3 border border-red-100">{error}</div>}
                            <div className="space-y-3">
                                <input type="email" placeholder="البريد الإلكتروني للإدارة" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-slate-50/50 text-xs font-bold transition-colors" required />
                                <input type="password" placeholder="كلمة المرور" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-slate-50/50 text-xs font-bold transition-colors" required />
                                <button type="submit" disabled={loginLoading} className="w-full bg-[#E30613] hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow-sm flex items-center justify-center gap-2 disabled:opacity-60">
                                    {loginLoading && <span className="spinner"></span>}
                                    {loginLoading ? 'جاري الدخول...' : 'تسجيل الدخول'}
                                </button>
                            </div>
                            <a href="index.html" className="block text-center mt-4 text-xs text-slate-400 font-bold hover:text-[#002060]">العودة للموقع الرئيسي</a>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-5xl mx-auto p-3.5 md:p-6">
                    {toast && (
                        <div role="status" aria-live="polite" className={`fixed top-4 left-1/2 -translate-x-1/2 z-[100] text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold whitespace-nowrap ${toast.type === 'error' ? 'bg-red-600' : 'bg-[#002060]'}`}>
                            {toast.message}
                        </div>
                    )}

                    <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200/70">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-full overflow-hidden shrink-0 shadow-sm ring-1 ring-slate-200 bg-[#001845]">
                                <img src="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png" alt="YLY" className="w-full h-full object-cover scale-125" />
                            </div>
                            <div>
                                <h1 className="text-base md:text-lg font-black text-[#002060]">إدارة أفكار كايزن</h1>
                                <p className="text-[10px] md:text-xs font-bold text-[#E30613]">لوحة التحكم المباشرة · {ideas.length} فكرة مسجلة</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2.5 self-end sm:self-auto">
                            <a href="index.html" className="text-xs font-bold text-[#002060] bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition-colors">عرض الموقع</a>
                            <button onClick={() => auth.signOut()} className="bg-red-50 hover:bg-red-100 text-red-600 border border-red-100 px-3 py-1.5 rounded-xl text-xs font-bold transition-colors">خروج</button>
                        </div>
                    </header>

                    {/* شريط البحث والفلترة مع إضافة مرفوض */}
                    <div className="flex flex-col sm:flex-row gap-2.5 mb-4">
                        <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="بحث بعنوان الفكرة أو اسم صاحبها..." className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-white text-xs font-bold transition-colors" />
                        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-white text-xs font-bold text-slate-700">
                            <option value="الكل">كل الحالات</option>
                            <option value="قيد المراجعة">قيد المراجعة</option>
                            <option value="جاري التنفيذ">جاري التنفيذ</option>
                            <option value="مكتمل">مكتمل</option>
                            <option value="مرفوض">مرفوض</option>
                        </select>
                    </div>

                    {/* عرض البطاقات في الهاتف */}
                    <div className="block md:hidden space-y-3">
                        {!ideasLoaded && [1,2,3].map(n => (
                            <div key={n} className="bg-white p-4 rounded-xl border border-slate-200/70 space-y-2">
                                <div className="h-4 w-3/4 rounded skeleton"></div>
                                <div className="h-8 rounded-lg skeleton"></div>
                            </div>
                        ))}
                        {ideasLoaded && filteredIdeas.length === 0 && (
                            <div className="bg-white p-8 text-center text-slate-400 font-bold text-xs rounded-2xl border border-slate-200/70">
                                لا توجد أفكار مطابقة للبحث
                            </div>
                        )}
                        {filteredIdeas.map(idea => (
                            <div key={idea.id} className="bg-white p-3.5 rounded-2xl border border-slate-200/70 shadow-xs space-y-2">
                                <div>
                                    <div className="flex items-start justify-between gap-2 mb-1">
                                        <h3 className="font-bold text-xs text-[#002060] leading-snug">{idea.title}</h3>
                                        <span className="text-[9px] font-bold text-[#E30613] bg-red-50 px-1.5 py-0.5 rounded border border-red-100/70 shrink-0">اللجنة: {idea.committee}</span>
                                    </div>
                                    <p className="text-[10px] text-slate-400 font-medium">صاحب الفكرة: {idea.author} · {idea.timeAgo}</p>
                                </div>

                                <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                                    <select
                                        disabled={busyId === idea.id}
                                        value={idea.status}
                                        onChange={(e) => updateStatus(idea.id, e.target.value)}
                                        className="border border-slate-200/80 px-2 py-1 rounded-lg bg-slate-50 text-[11px] font-bold text-slate-700"
                                    >
                                        <option value="قيد المراجعة">قيد المراجعة</option>
                                        <option value="جاري التنفيذ">جاري التنفيذ</option>
                                        <option value="مكتمل">مكتمل</option>
                                        <option value="مرفوض">مرفوض</option>
                                    </select>

                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-slate-600 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100">
                                            {idea.upvotes || 0} 🔥
                                        </span>
                                        <button
                                            disabled={busyId === idea.id}
                                            onClick={() => deleteIdea(idea.id)}
                                            className="bg-red-50 text-[#E30613] hover:bg-[#E30613] hover:text-white px-2.5 py-1 rounded-lg text-[11px] font-bold transition-colors border border-red-100"
                                        >
                                            {busyId === idea.id ? <span className="spinner"></span> : 'حذف'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* عرض الجدول في اللابتوب */}
                    <div className="hidden md:block bg-white rounded-2xl shadow-xs overflow-hidden border border-slate-200/70">
                        <table className="w-full text-right whitespace-nowrap">
                            <thead className="bg-slate-50 border-b border-slate-100">
                                <tr>
                                    <th className="p-3.5 font-bold text-slate-600 text-xs">عنوان الفكرة</th>
                                    <th className="p-3.5 font-bold text-slate-600 text-xs">اللجنة المعنية</th>
                                    <th className="p-3.5 font-bold text-slate-600 text-xs">الحالة</th>
                                    <th className="p-3.5 font-bold text-slate-600 text-xs text-center">الدعم</th>
                                    <th className="p-3.5 font-bold text-slate-600 text-xs text-center">إجراء</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {!ideasLoaded && [1,2,3].map(n => (
                                    <tr key={n}>
                                        <td className="p-3.5" colSpan={5}><div className="h-5 rounded skeleton"></div></td>
                                    </tr>
                                ))}
                                {ideasLoaded && filteredIdeas.length === 0 && (
                                    <tr><td colSpan={5} className="p-8 text-center text-slate-400 font-bold text-xs">لا توجد أفكار مطابقة</td></tr>
                                )}
                                {filteredIdeas.map(idea => (
                                    <tr key={idea.id} className={`hover:bg-slate-50/60 transition-colors ${busyId === idea.id ? 'opacity-50' : ''}`}>
                                        <td className="p-3.5">
                                            <p className="font-bold text-[#002060] text-xs max-w-xs truncate">{idea.title}</p>
                                            <p className="text-[10px] text-slate-400 mt-0.5">{idea.author} · {idea.timeAgo}</p>
                                        </td>
                                        <td className="p-3.5">
                                            <span className="text-[10px] font-bold text-[#E30613] bg-red-50 px-2 py-0.5 rounded border border-red-100/70">{idea.committee}</span>
                                        </td>
                                        <td className="p-3.5">
                                            <select disabled={busyId === idea.id} value={idea.status} onChange={(e) => updateStatus(idea.id, e.target.value)} className="border border-slate-200/80 px-2.5 py-1.5 rounded-lg bg-slate-50 text-xs font-bold text-slate-700">
                                                <option value="قيد المراجعة">قيد المراجعة</option>
                                                <option value="جاري التنفيذ">جاري التنفيذ</option>
                                                <option value="مكتمل">مكتمل</option>
                                                <option value="مرفوض">مرفوض</option>
                                            </select>
                                        </td>
                                        <td className="p-3.5 text-center font-bold text-xs text-slate-700">
                                            {idea.upvotes || 0} <span className="text-orange-500">🔥</span>
                                        </td>
                                        <td className="p-3.5 text-center">
                                            <button disabled={busyId === idea.id} onClick={() => deleteIdea(idea.id)} className="bg-red-50 text-[#E30613] hover:bg-[#E30613] hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors border border-red-100 disabled:opacity-60">
                                                {busyId === idea.id ? <span className="spinner"></span> : 'حذف'}
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPanel />);
    </script>
</body>
</html>
