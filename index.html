<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كايزن YLY</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        popIn: { '0%': { opacity: 0, transform: 'scale(0.95) translateX(-50%)' }, '100%': { opacity: 1, transform: 'scale(1) translateX(-50%)' } },
                    },
                    animation: {
                        'fade-in': 'fadeIn .2s ease-out both',
                        'slide-up': 'slideUp .25s ease-out both',
                        'pop-in': 'popIn .2s ease-out both',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat (v9) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; height: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 14px); }

        .fixed-bg-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f4f7fb;
            background-image:
                radial-gradient(circle at 10% 8%,  rgba(0,32,96,0.16) 0%, rgba(0,32,96,0.03) 26%, transparent 48%),
                radial-gradient(circle at 92% 6%,  rgba(30,64,175,0.14) 0%, rgba(30,64,175,0.02) 24%, transparent 46%),
                radial-gradient(circle at 90% 90%, rgba(0,32,96,0.18) 0%, rgba(0,32,96,0.04) 28%, transparent 52%);
            z-index: -1;
            pointer-events: none;
            transform: translateZ(0);
        }

        .spinner {
            width: 1rem; height: 1rem;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .skeleton {
            background: linear-gradient(90deg, #edf2f7 25%, #f8fafc 37%, #edf2f7 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
        }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        input, textarea, select, button { outline: none !important; }
        input:focus-visible, textarea:focus-visible, select:focus-visible { border-color: #002060 !important; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased selection:bg-[#002060] selection:text-white">
    <div class="fixed-bg-layer"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // --- Icons ---
        const Plus = ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const Flame = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
        const Award = ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>;
        const Home = ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const CheckCircle2 = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        const AlertCircle = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const XCircle = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>;
        const Clock = ({size=14, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const TrendingUp = ({size=14, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const MessageSquare = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const User = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const ChevronDown = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>;
        const ArrowRight = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
        const Send = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
        const X = ({size=22, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const LogOut = ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>;
        const Edit3 = ({size=16, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        const ShieldCheck = ({size=16, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const WifiOff = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>;

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyA3UqEDpP2Llt7ZkloqmlURGULdKEiWF3o",
            authDomain: "yly-2026.firebaseapp.com",
            projectId: "yly-2026",
            storageBucket: "yly-2026.firebasestorage.app",
            messagingSenderId: "599868603298",
            appId: "1:599868603298:web:f66010961895c707cb10fb"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const getAvatar = (name) => `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name || 'YLY')}&backgroundColor=002060,E30613`;
        const COMMITTEES = ['لجنة التنظيم', 'لجنة الموارد البشرية (HR)', 'لجنة السوشيال ميديا', 'لجنة العلاقات العامة (PR)', 'إدارة المشروع المركزية'];

        function YlyKaizenApp() {
            const [activeTab, setActiveTab] = useState('home');
            const [selectedIdeaId, setSelectedIdeaId] = useState(null);
            const [filter, setFilter] = useState('الكل');
            const [toast, setToast] = useState(null);
            const [newComment, setNewComment] = useState("");
            const [isCommenting, setIsCommenting] = useState(false);

            const [ideas, setIdeas] = useState([]);
            const [ideasLoaded, setIdeasLoaded] = useState(false);
            const [ideasError, setIdeasError] = useState(false);
            const [newIdea, setNewIdea] = useState({ title: '', problem: '', solution: '', committee: 'لجنة التنظيم' });
            const [isSubmittingIdea, setIsSubmittingIdea] = useState(false);

            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [isLoginView, setIsLoginView] = useState(true);
            const [authData, setAuthData] = useState({ name: '', phone: '', officialId: '', password: '', committee: 'لجنة التنظيم' });
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');

            // تعديل البروفايل داخلياً
            const [isEditingProfile, setIsEditingProfile] = useState(false);
            const [editProfileData, setEditProfileData] = useState({ name: '', phone: '', officialId: '', committee: 'لجنة التنظيم' });
            const [isSavingProfile, setIsSavingProfile] = useState(false);

            const [viewProfileData, setViewProfileData] = useState(null);
            const [fullScreenImage, setFullScreenImage] = useState(null);
            const [pendingVotes, setPendingVotes] = useState({});

            const toastTimer = useRef(null);

            const showToast = useCallback((message, type = 'success') => {
                if (toastTimer.current) clearTimeout(toastTimer.current);
                setToast({ message, type });
                toastTimer.current = setTimeout(() => setToast(null), 2600);
            }, []);

            // مراقبة المستخدم وجلب بياناته
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userDoc = await db.collection('users').doc(currentUser.uid).get();
                            if (userDoc.exists) {
                                const data = userDoc.data();
                                setUserProfile(data);
                                setEditProfileData({
                                    name: data.name || currentUser.displayName || '',
                                    phone: data.phone || '',
                                    officialId: data.officialId || '',
                                    committee: data.committee || 'لجنة التنظيم'
                                });
                            } else {
                                const defData = {
                                    name: currentUser.displayName || '',
                                    phone: '',
                                    officialId: '',
                                    committee: 'لجنة التنظيم'
                                };
                                setUserProfile(defData);
                                setEditProfileData(defData);
                            }
                        } catch(e) {
                            console.error(e);
                        }
                    } else {
                        setUserProfile(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            // الاستماع للأفكار
            useEffect(() => {
                const unsubscribe = db.collection('ideas').orderBy('createdAt', 'desc').onSnapshot(
                    snapshot => {
                        const fetchedIdeas = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data(),
                            upvoters: doc.data().upvoters || []
                        }));
                        setIdeas(fetchedIdeas);
                        setIdeasLoaded(true);
                        setIdeasError(false);
                    },
                    err => {
                        console.error(err);
                        setIdeasLoaded(true);
                        setIdeasError(true);
                    }
                );
                return () => unsubscribe();
            }, []);

            const topUsers = useMemo(() => {
                const userStats = {};
                ideas.forEach(idea => {
                    if (!userStats[idea.author]) {
                        userStats[idea.author] = {
                            name: idea.author,
                            avatar: idea.avatar,
                            uid: idea.authorUid,
                            committee: idea.role || 'لجنة التنظيم',
                            score: 0
                        };
                    }
                    userStats[idea.author].score += 10 + ((idea.upvotes || 0) * 2);
                });
                return Object.values(userStats)
                    .sort((a, b) => b.score - a.score)
                    .map((usr, index) => ({ ...usr, rank: index + 1 }));
            }, [ideas]);

            const filteredIdeas = useMemo(() => {
                return ideas.filter(idea => filter === 'الكل' ? true : idea.status === filter);
            }, [ideas, filter]);

            const filterCounts = useMemo(() => {
                const counts = { 'الكل': ideas.length, 'قيد المراجعة': 0, 'جاري التنفيذ': 0, 'مكتمل': 0, 'مرفوض': 0 };
                ideas.forEach(i => { if (counts[i.status] !== undefined) counts[i.status]++; });
                return counts;
            }, [ideas]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                let phone = authData.phone.trim();
                if (phone.startsWith('0')) phone = phone.substring(1);

                if (phone.length !== 10) {
                    setAuthError('رقم الهاتف يجب أن يتكون من 10 أرقام (بدون الصفر)');
                    return;
                }
                if (authData.password.length < 6) {
                    setAuthError('كلمة المرور يجب ألا تقل عن 6 أحرف');
                    return;
                }
                if (!isLoginView && authData.name.trim().length < 3) {
                    setAuthError('الرجاء كتابة اسمك الرباعي كاملاً');
                    return;
                }

                const fakeEmail = `${phone}@yly.com`;
                setAuthLoading(true);
                try {
                    if (isLoginView) {
                        await auth.signInWithEmailAndPassword(fakeEmail, authData.password);
                        showToast('تم تسجيل الدخول بنجاح');
                    } else {
                        const res = await auth.createUserWithEmailAndPassword(fakeEmail, authData.password);
                        const cleanName = authData.name.trim();
                        await res.user.updateProfile({ displayName: cleanName });
                        
                        const profileObj = {
                            name: cleanName,
                            phone: phone,
                            officialId: authData.officialId.trim(),
                            committee: authData.committee,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };

                        await db.collection('users').doc(res.user.uid).set(profileObj);

                        setUser({ ...res.user, displayName: cleanName });
                        setUserProfile(profileObj);
                        setEditProfileData({
                            name: cleanName,
                            phone: phone,
                            officialId: authData.officialId.trim(),
                            committee: authData.committee
                        });
                        showToast('تم إنشاء الحساب بنجاح');
                    }
                    setActiveTab('home');
                    setAuthData({ name: '', phone: '', officialId: '', password: '', committee: 'لجنة التنظيم' });
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') {
                        setAuthError('رقم الهاتف مسجل بالفعل، قم بتسجيل الدخول بدلاً من إنشاء حساب.');
                    } else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        setAuthError('رقم الهاتف أو كلمة المرور غير صحيحة.');
                    } else if (error.code === 'auth/network-request-failed') {
                        setAuthError('تعذر الاتصال بالإنترنت، يرجى المحاولة لاحقاً.');
                    } else {
                        setAuthError('حدث خطأ غير متوقع، يرجى إعادة المحاولة.');
                    }
                } finally {
                    setAuthLoading(false);
                }
            };

            // حفظ تعديل البروفايل
            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                if (!user) return;
                if (editProfileData.name.trim().length < 3) {
                    showToast('الاسم يجب أن يكون ثلاثياً أو رباعياً', 'error');
                    return;
                }

                setIsSavingProfile(true);
                try {
                    const cleanName = editProfileData.name.trim();
                    let cleanPhone = editProfileData.phone.trim();
                    if (cleanPhone.startsWith('0')) cleanPhone = cleanPhone.substring(1);

                    await user.updateProfile({ displayName: cleanName });
                    
                    const updatedData = {
                        name: cleanName,
                        phone: cleanPhone,
                        officialId: editProfileData.officialId.trim(),
                        committee: editProfileData.committee,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    await db.collection('users').doc(user.uid).set(updatedData, { merge: true });

                    setUserProfile(prev => ({ ...prev, ...updatedData }));
                    if (viewProfileData) {
                        setViewProfileData({
                            ...viewProfileData,
                            name: cleanName,
                            committee: editProfileData.committee,
                            officialId: editProfileData.officialId.trim(),
                            phone: cleanPhone,
                            avatar: getAvatar(cleanName)
                        });
                    }
                    setIsEditingProfile(false);
                    showToast('تم حفظ التعديلات بنجاح');
                } catch (err) {
                    console.error(err);
                    showToast('حدث خطأ أثناء حفظ التعديلات', 'error');
                } finally {
                    setIsSavingProfile(false);
                }
            };

            const requireAuth = (nextTab) => {
                if (user) setActiveTab(nextTab);
                else { setAuthError(''); setActiveTab('auth'); }
            };

            const handleUpvote = async (id, e) => {
                if (e) e.stopPropagation();
                if (!user) {
                    showToast('يرجى تسجيل الدخول للتفاعل والدعم', 'info');
                    setActiveTab('auth');
                    return;
                }
                if (pendingVotes[id]) return;

                const idea = ideas.find(i => i.id === id);
                if (!idea) return;

                const hasUpvoted = (idea.upvoters || []).includes(user.uid);
                setPendingVotes(p => ({ ...p, [id]: true }));

                try {
                    const ideaRef = db.collection('ideas').doc(id);
                    if (hasUpvoted) {
                        await ideaRef.update({
                            upvotes: firebase.firestore.FieldValue.increment(-1),
                            upvoters: firebase.firestore.FieldValue.arrayRemove(user.uid)
                        });
                    } else {
                        await ideaRef.update({
                            upvotes: firebase.firestore.FieldValue.increment(1),
                            upvoters: firebase.firestore.FieldValue.arrayUnion(user.uid)
                        });
                    }
                } catch (err) {
                    console.error(err);
                    showToast('تعذر تسجيل الدعم، تحقق من الاتصال', 'error');
                } finally {
                    setPendingVotes(p => { const n = { ...p }; delete n[id]; return n; });
                }
            };

            const handleSubmitIdea = async (e) => {
                e.preventDefault();
                if (!newIdea.title.trim() || !newIdea.problem.trim() || !newIdea.solution.trim()) {
                    showToast('يرجى إكمال جميع الحقول المطلوبة', 'error');
                    return;
                }
                if (!user) { setActiveTab('auth'); return; }
                if (isSubmittingIdea) return;

                setIsSubmittingIdea(true);
                try {
                    const authorName = user.displayName || userProfile?.name || "عضو YLY";
                    await db.collection('ideas').add({
                        title: newIdea.title.trim(),
                        problem: newIdea.problem.trim(),
                        solution: newIdea.solution.trim(),
                        committee: newIdea.committee,
                        status: "قيد المراجعة",
                        author: authorName,
                        authorUid: user.uid,
                        avatar: getAvatar(authorName),
                        role: userProfile?.committee || "عضو",
                        upvotes: 0,
                        upvoters: [],
                        timeAgo: new Date().toLocaleDateString('ar-EG'),
                        commentsList: [],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewIdea({ title: '', problem: '', solution: '', committee: 'لجنة التنظيم' });
                    setActiveTab('home');
                    showToast('تم إرسال فكرتك للإدارة بنجاح');
                } catch (err) {
                    console.error(err);
                    showToast('تعذر إرسال الفكرة، حاول ثانية', 'error');
                } finally {
                    setIsSubmittingIdea(false);
                }
            };

            const handleAddComment = async (ideaId) => {
                if (!newComment.trim()) return;
                if (!user) { setActiveTab('auth'); return; }
                if (isCommenting) return;

                const authorName = user.displayName || userProfile?.name || "عضو YLY";
                const newCommentObj = {
                    id: Date.now().toString(),
                    author: authorName,
                    authorUid: user.uid,
                    avatar: getAvatar(authorName),
                    committee: userProfile?.committee || "عضو",
                    text: newComment.trim(),
                    time: new Date().toLocaleDateString('ar-EG')
                };

                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-800 block mb-1">اللجنة المعنية بتطبيق الفكرة <span className="text-red-500">*</span></label>
                                            <div className="relative">
                                                <select value={newIdea.committee} onChange={(e) => setNewIdea({...newIdea, committee: e.target.value})} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-slate-50/50 text-xs md:text-sm font-bold appearance-none text-slate-700">
                                                    {COMMITTEES.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                                <ChevronDown size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-800 block mb-1">ما هو التحدي أو المشكلة الحالية؟ <span className="text-red-500">*</span></label>
                                            <textarea required rows="3" maxLength={600} value={newIdea.problem} onChange={(e) => setNewIdea({...newIdea, problem: e.target.value})} className="w-full px-3.5 py-2 rounded-xl border border-red-100 bg-red-50/20 text-xs md:text-sm font-medium resize-none transition-colors" placeholder="اشرح الهدر، التعطيل، أو الصعوبة الحالية..."></textarea>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-800 block mb-1">ما هو حلك المقترح (كايزن)؟ <span className="text-red-500">*</span></label>
                                            <textarea required rows="3" maxLength={800} value={newIdea.solution} onChange={(e) => setNewIdea({...newIdea, solution: e.target.value})} className="w-full px-3.5 py-2 rounded-xl border border-blue-100 bg-[#002060]/[0.02] text-xs md:text-sm font-medium resize-none transition-colors" placeholder="كيف نحل المشكلة بطريقة أسرع وأبسط وبدون تعقيد..."></textarea>
                                        </div>
                                        <button type="submit" disabled={isSubmittingIdea} className="w-full bg-[#002060] hover:bg-blue-900 text-white py-2.5 rounded-xl font-bold text-xs md:text-sm shadow-sm flex items-center justify-center gap-2 disabled:opacity-60 transition-all active:scale-[0.99]">
                                            {isSubmittingIdea && <span className="spinner"></span>}
                                            {isSubmittingIdea ? 'جاري الإرسال...' : 'إرسال الفكرة للمراجعة'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* --- صفحة البروفايل (تعديل داخلي بالصفحة بدون نوافذ منبثقة) --- */}
                        {activeTab === 'profile' && viewProfileData && (
                            <div className="max-w-md mx-auto px-3.5 md:px-6">
                                <div className="bg-white/95 rounded-2xl p-5 text-center border border-slate-200/70 shadow-sm mt-8 relative animate-fade-in">
                                    
                                    {/* أزرار الإجراءات الخاصة بصاحب الحساب */}
                                    {user && viewProfileData.uid === user.uid && (
                                        <div className="absolute top-3.5 left-3.5 flex items-center gap-1.5">
                                            {!isEditingProfile && (
                                                <button
                                                    onClick={() => setIsEditingProfile(true)}
                                                    aria-label="تعديل البروفايل"
                                                    title="تعديل البروفايل"
                                                    className="w-8 h-8 bg-blue-50 text-[#002060] hover:bg-blue-100 rounded-full flex items-center justify-center border border-blue-100 transition-colors"
                                                >
                                                    <Edit3 size={14} />
                                                </button>
                                            )}
                                            <button
                                                onClick={() => { auth.signOut(); setActiveTab('home'); showToast('تم تسجيل الخروج'); }}
                                                aria-label="تسجيل الخروج"
                                                title="تسجيل الخروج"
                                                className="w-8 h-8 bg-red-50 text-red-500 hover:bg-red-100 rounded-full flex items-center justify-center border border-red-100 transition-colors"
                                            >
                                                <LogOut size={14} />
                                            </button>
                                        </div>
                                    )}

                                    {/* وضع العرض العادي */}
                                    {!isEditingProfile ? (
                                        <>
                                            <div className="w-20 h-20 mx-auto -mt-10 mb-2.5 rounded-full border-2 border-white shadow-md overflow-hidden bg-slate-100 cursor-pointer active:scale-95 transition-transform" onClick={() => setFullScreenImage(viewProfileData.avatar)}>
                                                <img src={viewProfileData.avatar} className="w-full h-full object-cover" alt="" />
                                            </div>
                                            <h2 className="text-base font-black text-[#002060] mb-0.5">{viewProfileData.name}</h2>
                                            <span className="inline-block px-2.5 py-0.5 bg-red-50 text-[#E30613] text-[10px] font-bold rounded-md border border-red-100/70 mb-3">{viewProfileData.committee}</span>

                                            {/* إظهار بيانات إضافية للعضو صاحب الحساب */}
                                            {user && viewProfileData.uid === user.uid && (
                                                <div className="bg-slate-50/70 p-2.5 rounded-xl border border-slate-200/60 mb-3 text-right space-y-1.5">
                                                    <div className="flex items-center justify-between text-xs">
                                                        <span className="text-slate-400 font-bold">الرقم الرسمي / الكودي:</span>
                                                        <span className="text-slate-700 font-black">{userProfile?.officialId || 'غير مسجل'}</span>
                                                    </div>
                                                    <div className="flex items-center justify-between text-xs">
                                                        <span className="text-slate-400 font-bold">رقم الهاتف:</span>
                                                        <span className="text-slate-700 font-bold" dir="ltr">{userProfile?.phone ? `+20 ${userProfile.phone}` : 'غير مسجل'}</span>
                                                    </div>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-2 gap-2.5 border-t border-slate-100 pt-3.5">
                                                <div className="bg-slate-50/80 p-2.5 rounded-xl border border-slate-200/40">
                                                    <span className="text-[10px] text-slate-400 font-bold block mb-0.5">الأفكار المطروحة</span>
                                                    <p className="text-base font-black text-[#002060]">{ideas.filter(i => i.author === viewProfileData.name).length}</p>
                                                </div>
                                                <div className="bg-orange-50/70 p-2.5 rounded-xl border border-orange-100/40">
                                                    <span className="text-[10px] text-orange-400 font-bold block mb-0.5">إجمالي الدعم</span>
                                                    <p className="text-base font-black text-orange-500">{ideas.filter(i => i.author === viewProfileData.name).reduce((sum, i) => sum + (i.upvotes || 0), 0)}</p>
                                                </div>
                                            </div>
                                        </>
                                    ) : (
                                        /* نموذج التعديل الداخلي السلس */
                                        <div className="text-right pt-2 animate-fade-in">
                                            <h3 className="text-sm font-black text-[#002060] mb-3 text-center flex items-center justify-center gap-1.5">
                                                <Edit3 size={15} /> تعديل بيانات الملف الشخصي
                                            </h3>
                                            <form onSubmit={handleUpdateProfile} className="space-y-3">
                                                <div>
                                                    <label className="text-xs font-bold text-slate-700 block mb-1">الاسم الرباعي <span className="text-red-500">*</span></label>
                                                    <input type="text" required value={editProfileData.name} onChange={(e) => setEditProfileData({...editProfileData, name: e.target.value})} className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold" placeholder="اسمك كاملاً" />
                                                </div>

                                                <div>
                                                    <label className="text-xs font-bold text-slate-700 block mb-1">الرقم الرسمي / الكودي</label>
                                                    <input type="text" value={editProfileData.officialId} onChange={(e) => setEditProfileData({...editProfileData, officialId: e.target.value})} className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold" placeholder="الرقم التعريفي في الكيان إن وجد" />
                                                </div>

                                                <div>
                                                    <label className="text-xs font-bold text-slate-700 block mb-1">رقم الهاتف</label>
                                                    <div className="flex items-stretch w-full rounded-xl border border-slate-200 bg-slate-50 overflow-hidden">
                                                        <input type="tel" inputMode="numeric" placeholder="10 أرقام" value={editProfileData.phone} onChange={(e) => setEditProfileData({...editProfileData, phone: e.target.value.replace(/\D/g, '').slice(0,10)})} className="flex-1 px-3 py-2 text-xs font-bold text-left bg-transparent" dir="ltr" />
                                                        <div className="flex items-center justify-center px-2.5 bg-slate-100 text-slate-500 font-bold text-xs" dir="ltr">+20</div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="text-xs font-bold text-slate-700 block mb-1">اللجنة التابع لها <span className="text-red-500">*</span></label>
                                                    <div className="relative">
                                                        <select value={editProfileData.committee} onChange={(e) => setEditProfileData({...editProfileData, committee: e.target.value})} className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold appearance-none text-slate-700">
                                                            {COMMITTEES.map(c => <option key={c} value={c}>{c}</option>)}
                                                        </select>
                                                        <ChevronDown size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-2 pt-2">
                                                    <button type="submit" disabled={isSavingProfile} className="flex-1 bg-[#002060] text-white py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-all">
                                                        {isSavingProfile && <span className="spinner"></span>}
                                                        <span>{isSavingProfile ? 'جاري الحفظ...' : 'حفظ التعديلات'}</span>
                                                    </button>
                                                    <button type="button" onClick={() => setIsEditingProfile(false)} className="px-4 py-2.5 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs hover:bg-slate-200 transition-colors">
                                                        إلغاء
                                                    </button>
                                                </div>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* --- صفحة أبطال الكيان --- */}
                        {activeTab === 'leaderboard' && (
                            <div className="max-w-2xl mx-auto px-3.5 md:px-6">
                                <div className="bg-[#002060] rounded-2xl p-4 md:p-5 text-center text-white mb-3 shadow-sm border border-blue-900">
                                    <Award size={36} className="mx-auto text-yellow-400 mb-1.5" />
                                    <h2 className="text-base md:text-lg font-black mb-0.5">أبطال YLY للتطوير</h2>
                                    <p className="text-blue-200 font-medium text-xs">الأعضاء الأكثر تقديماً للأفكار وتأثيراً بالكيان</p>
                                </div>

                                {!ideasLoaded ? (
                                    <div className="space-y-2">{[1,2,3].map(n => <div key={n} className="h-12 rounded-xl skeleton"></div>)}</div>
                                ) : topUsers.length === 0 ? (
                                    <div className="text-center py-8 bg-white/90 rounded-2xl border border-dashed border-slate-300">
                                        <p className="text-slate-400 font-medium text-xs">لا يوجد أبطال حتى الآن. اطرح فكرة وكن الأول!</p>
                                    </div>
                                ) : (
                                    <div className="bg-white/95 rounded-2xl border border-slate-200/70 shadow-sm overflow-hidden p-1.5 space-y-1">
                                        {topUsers.map((usr, idx) => (
                                            <div key={usr.name} onClick={() => openProfile(usr.name, usr.avatar, usr.committee, usr.uid)} className={`flex items-center p-2 rounded-xl cursor-pointer transition-colors ${idx === 0 ? 'bg-amber-50/70 border border-amber-200/50' : 'hover:bg-slate-50'}`}>
                                                <div className="w-7 text-center font-black text-xs">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}</div>
                                                <div className="flex-1 flex items-center gap-2 px-1.5 min-w-0">
                                                    <div className="w-8 h-8 bg-slate-100 rounded-full border border-slate-200 overflow-hidden shrink-0">
                                                        <img src={usr.avatar} alt="" className="w-full h-full object-cover" />
                                                    </div>
                                                    <div className="min-w-0">
                                                        <h4 className="font-bold text-slate-900 text-xs truncate">{usr.name}</h4>
                                                        <p className="text-[9px] font-bold text-[#E30613] truncate">{usr.committee}</p>
                                                    </div>
                                                </div>
                                                <div className="text-left shrink-0">
                                                    <div className="bg-white text-slate-700 px-2 py-0.5 rounded-lg font-bold text-xs flex items-center gap-1 border border-slate-200/60">
                                                        <Flame size={12} className={idx < 3 ? "text-orange-500 fill-orange-500" : "text-slate-400"} /> {usr.score}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <div className="h-6" aria-hidden="true"></div>
                            </div>
                        )}

                        {/* --- صفحة الدخول / إنشاء حساب --- */}
                        {activeTab === 'auth' && (
                            <div className="max-w-sm mx-auto px-3.5 md:px-6 mt-2">
                                <div className="bg-white/95 p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200/70">
                                    <div className="flex justify-center mb-2.5">
                                        <div className="w-11 h-11 bg-slate-50 border border-slate-200/60 rounded-xl flex items-center justify-center">
                                            <User size={20} className="text-[#002060]" />
                                        </div>
                                    </div>
                                    <h2 className="text-base font-black text-[#002060] text-center mb-0.5">
                                        {isLoginView ? 'تسجيل الدخول' : 'انضمام كعضو جديد'}
                                    </h2>
                                    <p className="text-center text-xs text-slate-500 mb-3.5 font-medium">
                                        {isLoginView ? 'مرحباً بعودتك إلى كايزن YLY' : 'سجل بياناتك للمشاركة في تطوير الكيان'}
                                    </p>

                                    {authError && (
                                        <div role="alert" className="bg-red-50 border border-red-200/60 text-red-600 text-xs font-bold rounded-xl p-2.5 mb-3 flex items-start gap-1.5 animate-fade-in">
                                            <AlertCircle size={15} className="shrink-0 mt-0.5" /><span>{authError}</span>
                                        </div>
                                    )}

                                    <form onSubmit={handleAuth} className="space-y-3">
                                        {!isLoginView && (
                                            <>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-700 block mb-1">الاسم الرباعي <span className="text-red-500">*</span></label>
                                                    <input type="text" placeholder="اكتب اسمك الرباعي كاملاً" value={authData.name} onChange={(e) => setAuthData({...authData, name: e.target.value})} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-slate-50/50 text-xs font-bold transition-colors" required />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-700 block mb-1">الرقم الرسمي / الكودي (اختياري)</label>
                                                    <input type="text" placeholder="الرقم الرسمي الخاص بك" value={authData.officialId} onChange={(e) => setAuthData({...authData, officialId: e.target.value})} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-slate-50/50 text-xs font-bold transition-colors" />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-700 block mb-1">اللجنة التابع لها <span className="text-red-500">*</span></label>
                                                    <div className="relative">
                                                        <select value={authData.committee} onChange={(e) => setAuthData({...authData, committee: e.target.value})} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-slate-50/50 text-xs font-bold appearance-none text-slate-700">
                                                            {COMMITTEES.map(c => <option key={c} value={c}>{c}</option>)}
                                                        </select>
                                                        <ChevronDown size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                                                    </div>
                                                </div>
                                            </>
                                        )}

                                        <div>
                                            <label className="text-xs font-bold text-slate-700 block mb-1">رقم الهاتف <span className="text-red-500">*</span></label>
                                            <div className="flex items-stretch w-full rounded-xl border border-slate-200/80 bg-slate-50/50 overflow-hidden">
                                                <input type="tel" inputMode="numeric" placeholder="10 أرقام (بدون 0)" value={authData.phone} onChange={(e) => setAuthData({...authData, phone: e.target.value.replace(/\D/g, '').slice(0,10)})} className="flex-1 px-3.5 py-2.5 text-xs font-bold text-left bg-transparent" dir="ltr" required />
                                                <div className="flex items-center justify-center px-3 bg-slate-100 border-r border-slate-200/80 text-slate-500 font-bold text-xs" dir="ltr">+20</div>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-xs font-bold text-slate-700 block mb-1">كلمة المرور <span className="text-red-500">*</span></label>
                                            <input type="password" placeholder="٦ أحرف على الأقل" value={authData.password} onChange={(e) => setAuthData({...authData, password: e.target.value})} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200/80 bg-slate-50/50 text-xs font-bold transition-colors" required minLength={6} />
                                        </div>

                                        <button type="submit" disabled={authLoading} className="w-full bg-[#E30613] hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow-sm flex items-center justify-center gap-1.5 disabled:opacity-60 active:scale-[0.99] mt-1">
                                            {authLoading && <span className="spinner"></span>}
                                            {authLoading ? 'برجاء الانتظار...' : (isLoginView ? 'تسجيل الدخول' : 'تأكيد وإنشاء الحساب')}
                                        </button>
                                    </form>

                                    <div className="mt-3.5 text-center border-t border-slate-100 pt-3">
                                        <button onClick={() => { setIsLoginView(!isLoginView); setAuthError(''); }} className="text-xs font-bold text-slate-500 hover:text-[#E30613] transition-colors">
                                            {isLoginView ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* البار السفلي في الموبايل */}
                    {isMainTab && (
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200/80 flex justify-around items-center h-14 pb-safe z-30 px-2 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center justify-center w-16 h-full ${activeTab === 'home' ? 'text-[#002060]' : 'text-slate-400'}`}>
                                <Home size={18} />
                                <span className="text-[10px] font-bold mt-0.5">الرئيسية</span>
                            </button>
                            <div className="relative -top-4">
                                <button onClick={() => requireAuth('add-idea')} aria-label="طرح فكرة" className="bg-[#E30613] text-white w-12 h-12 rounded-full flex items-center justify-center shadow-md border-2 border-white active:scale-90 transition-transform">
                                    <Plus size={22} />
                                </button>
                            </div>
                            <button onClick={() => setActiveTab('leaderboard')} className={`flex flex-col items-center justify-center w-16 h-full ${activeTab === 'leaderboard' ? 'text-[#002060]' : 'text-slate-400'}`}>
                                <Award size={18} />
                                <span className="text-[10px] font-bold mt-0.5">أبطال الكيان</span>
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<YlyKaizenApp />);
    </script>
</body>
</html>
