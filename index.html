<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كايزن YLY</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        popIn: { '0%': { opacity: 0, transform: 'scale(0.92) translateX(-50%)' }, '100%': { opacity: 1, transform: 'scale(1) translateX(-50%)' } },
                    },
                    animation: {
                        'fade-in': 'fadeIn .25s ease-out both',
                        'slide-up': 'slideUp .3s ease-out both',
                        'pop-in': 'popIn .22s cubic-bezier(.34,1.56,.64,1) both',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat (v9) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        /* طبقة الخلفية الثابتة لمنع الاهتزاز في الموبايل — تدرج دوائر متوهجة بدرجات أزرق غامق فاخرة */
        .fixed-bg-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background-color: #f2f5fb;
            background-image:
                radial-gradient(circle at 10% 8%,  rgba(0,32,96,0.30)  0%, rgba(0,32,96,0.10)  26%, rgba(0,32,96,0) 48%),
                radial-gradient(circle at 92% 6%,   rgba(30,64,175,0.26) 0%, rgba(30,64,175,0.08) 24%, rgba(30,64,175,0) 46%),
                radial-gradient(circle at 90% 90%,  rgba(0,32,96,0.34)  0%, rgba(0,32,96,0.12)  28%, rgba(0,32,96,0) 52%),
                radial-gradient(circle at 6% 92%,   rgba(23,58,140,0.30) 0%, rgba(23,58,140,0.09) 26%, rgba(23,58,140,0) 50%),
                radial-gradient(circle at 50% 48%,  rgba(59,101,224,0.10) 0%, rgba(59,101,224,0) 60%);
            z-index: -1;
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform;
        }

        /* دوّار تحميل بسيط */
        .spinner {
            width: 1em; height: 1em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* حالة تحميل هيكلية (skeleton) */
        .skeleton {
            background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 37%, #eef2f7 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
        }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
            outline: 2px solid #002060;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">
    <!-- طبقة الخلفية الثابتة -->
    <div class="fixed-bg-layer"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // --- الأيقونات (خفيفة وسريعة) ---
        const Plus = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const Flame = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
        const Award = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>;
        const Home = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const CheckCircle2 = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        const AlertCircle = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const Clock = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const TrendingUp = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const MessageSquare = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const User = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const ChevronDown = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>;
        const ArrowRight = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
        const Send = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
        const X = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const LogOut = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>;
        const WifiOff = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>;

        // --- Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyA3UqEDpP2Llt7ZkloqmlURGULdKEiWF3o",
            authDomain: "yly-2026.firebaseapp.com",
            projectId: "yly-2026",
            storageBucket: "yly-2026.firebasestorage.app",
            messagingSenderId: "599868603298",
            appId: "1:599868603298:web:f66010961895c707cb10fb"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const getAvatar = (name) => `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=002060,E30613`;

        const COMMITTEES = ['لجنة التنظيم', 'لجنة الموارد البشرية (HR)', 'لجنة السوشيال ميديا', 'لجنة العلاقات العامة (PR)', 'إدارة المشروع المركزية'];

        function YlyKaizenApp() {
            const [activeTab, setActiveTab] = useState('home');
            const [selectedIdeaId, setSelectedIdeaId] = useState(null);
            const [filter, setFilter] = useState('الكل');
            const [toast, setToast] = useState(null);
            const [newComment, setNewComment] = useState("");
            const [isCommenting, setIsCommenting] = useState(false);

            const [ideas, setIdeas] = useState([]);
            const [ideasLoaded, setIdeasLoaded] = useState(false);
            const [ideasError, setIdeasError] = useState(false);
            const [newIdea, setNewIdea] = useState({ title: '', problem: '', solution: '', committee: 'لجنة التنظيم' });
            const [isSubmittingIdea, setIsSubmittingIdea] = useState(false);

            const [user, setUser] = useState(null);
            const [authChecked, setAuthChecked] = useState(false);
            const [isLoginView, setIsLoginView] = useState(true);
            const [authData, setAuthData] = useState({ name: '', phone: '', password: '' });
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');

            const [viewProfileData, setViewProfileData] = useState(null);
            const [fullScreenImage, setFullScreenImage] = useState(null);
            const [pendingVotes, setPendingVotes] = useState({});

            const toastTimer = useRef(null);

            const upvotedIdeas = useMemo(() => {
                try { return JSON.parse(localStorage.getItem('upvotedIdeas') || '[]'); }
                catch { return []; }
            }, [ideas]);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    setAuthChecked(true);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const unsubscribe = db.collection('ideas').orderBy('createdAt', 'desc').onSnapshot(
                    snapshot => {
                        const fetchedIdeas = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data(),
                            isUpvoted: upvotedIdeas.includes(doc.id)
                        }));
                        setIdeas(fetchedIdeas);
                        setIdeasLoaded(true);
                        setIdeasError(false);
                    },
                    err => {
                        console.error(err);
                        setIdeasLoaded(true);
                        setIdeasError(true);
                    }
                );
                return () => unsubscribe();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            const showToast = useCallback((message, type = 'success') => {
                if (toastTimer.current) clearTimeout(toastTimer.current);
                setToast({ message, type });
                toastTimer.current = setTimeout(() => setToast(null), 3000);
            }, []);

            const topUsers = useMemo(() => {
                const userStats = {};
                ideas.forEach(idea => {
                    if (!userStats[idea.author]) {
                        userStats[idea.author] = {
                            name: idea.author,
                            avatar: idea.avatar,
                            role: idea.role || 'عضو',
                            score: 0
                        };
                    }
                    userStats[idea.author].score += 10 + ((idea.upvotes || 0) * 2);
                });
                return Object.values(userStats)
                    .sort((a, b) => b.score - a.score)
                    .map((usr, index) => ({ ...usr, rank: index + 1 }));
            }, [ideas]);

            const filteredIdeas = useMemo(() => {
                return ideas.filter(idea => filter === 'الكل' ? true : idea.status === filter);
            }, [ideas, filter]);

            const filterCounts = useMemo(() => {
                const counts = { 'الكل': ideas.length, 'قيد المراجعة': 0, 'جاري التنفيذ': 0, 'مكتمل': 0 };
                ideas.forEach(i => { if (counts[i.status] !== undefined) counts[i.status]++; });
                return counts;
            }, [ideas]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                let phone = authData.phone.trim();
                if (phone.startsWith('0')) phone = phone.substring(1);

                if (phone.length !== 10) {
                    setAuthError('رقم الهاتف يجب أن يتكون من 10 أرقام (بدون الصفر)');
                    return;
                }
                if (authData.password.length < 6) {
                    setAuthError('كلمة المرور يجب ألا تقل عن 6 أحرف');
                    return;
                }
                if (!isLoginView && authData.name.trim().length < 3) {
                    setAuthError('الرجاء كتابة اسمك الرباعي كاملاً');
                    return;
                }

                const fakeEmail = `${phone}@yly.com`;
                setAuthLoading(true);
                try {
                    if (isLoginView) {
                        await auth.signInWithEmailAndPassword(fakeEmail, authData.password);
                        showToast('تم تسجيل الدخول بنجاح!');
                    } else {
                        const res = await auth.createUserWithEmailAndPassword(fakeEmail, authData.password);
                        await res.user.updateProfile({ displayName: authData.name.trim() });
                        // فرض تحديث حالة المستخدم محلياً فوراً باسمه الجديد
                        setUser({ ...res.user, displayName: authData.name.trim() });
                        showToast('تم إنشاء الحساب بنجاح!');
                    }
                    setActiveTab('home');
                    setAuthData({ name: '', phone: '', password: '' });
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') {
                        setAuthError('رقم الهاتف مسجل بالفعل، قم بتسجيل الدخول بدلاً من إنشاء حساب.');
                    } else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        setAuthError('رقم الهاتف أو كلمة المرور غير صحيحة.');
                    } else if (error.code === 'auth/network-request-failed') {
                        setAuthError('تعذر الاتصال بالإنترنت، تحقق من اتصالك وحاول مرة أخرى.');
                    } else {
                        setAuthError('حدث خطأ غير متوقع، برجاء المحاولة لاحقاً.');
                    }
                } finally {
                    setAuthLoading(false);
                }
            };

            const requireAuth = (nextTab) => {
                if (user) setActiveTab(nextTab);
                else { setAuthError(''); setActiveTab('auth'); }
            };

            const handleUpvote = async (id, e) => {
                if (e) e.stopPropagation();
                if (!user) { showToast('يجب تسجيل الدخول للتصويت', 'info'); setActiveTab('auth'); return; }
                if (pendingVotes[id]) return; // امنع الضغط المزدوج السريع

                const idea = ideas.find(i => i.id === id);
                if (!idea) return;
                const wasUpvoted = idea.isUpvoted;
                setPendingVotes(p => ({ ...p, [id]: true }));

                let newUpvotedList = [...upvotedIdeas];
                try {
                    if (wasUpvoted) {
                        await db.collection('ideas').doc(id).update({ upvotes: firebase.firestore.FieldValue.increment(-1) });
                        newUpvotedList = newUpvotedList.filter(i => i !== id);
                    } else {
                        await db.collection('ideas').doc(id).update({ upvotes: firebase.firestore.FieldValue.increment(1) });
                        newUpvotedList.push(id);
                    }
                    localStorage.setItem('upvotedIdeas', JSON.stringify(newUpvotedList));
                } catch (err) {
                    console.error(err);
                    showToast('تعذر تسجيل الدعم، حاول مرة أخرى.', 'error');
                } finally {
                    setPendingVotes(p => { const n = { ...p }; delete n[id]; return n; });
                }
            };

            const handleSubmitIdea = async (e) => {
                e.preventDefault();
                if (!newIdea.title.trim() || !newIdea.problem.trim() || !newIdea.solution.trim()) {
                    showToast('من فضلك اكمل جميع الحقول المطلوبة', 'error');
                    return;
                }
                if (!user) { setActiveTab('auth'); return; }
                if (isSubmittingIdea) return;

                setIsSubmittingIdea(true);
                try {
                    await db.collection('ideas').add({
                        title: newIdea.title.trim(),
                        problem: newIdea.problem.trim(),
                        solution: newIdea.solution.trim(),
                        committee: newIdea.committee,
                        status: "قيد المراجعة",
                        author: user.displayName || "عضو YLY",
                        avatar: getAvatar(user.displayName || "YLY"),
                        role: "عضو",
                        upvotes: 0,
                        timeAgo: new Date().toLocaleDateString('ar-EG'),
                        commentsList: [],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewIdea({ title: '', problem: '', solution: '', committee: 'لجنة التنظيم' });
                    setActiveTab('home');
                    showToast('تم إرسال فكرتك للإدارة بنجاح!');
                } catch (err) {
                    console.error(err);
                    showToast('تعذر إرسال الفكرة، تحقق من اتصالك وحاول مرة أخرى.', 'error');
                } finally {
                    setIsSubmittingIdea(false);
                }
            };

            const handleAddComment = async (ideaId) => {
                if (!newComment.trim()) return;
                if (!user) { setActiveTab('auth'); return; }
                if (isCommenting) return;

                const newCommentObj = {
                    id: Date.now(),
                    author: user.displayName || "عضو YLY",
                    avatar: getAvatar(user.displayName || "YLY"),
                    role: "عضو",
                    text: newComment.trim(),
                    time: new Date().toLocaleDateString('ar-EG')
                };

                setIsCommenting(true);
                try {
                    await db.collection('ideas').doc(ideaId).update({
                        commentsList: firebase.firestore.FieldValue.arrayUnion(newCommentObj)
                    });
                    setNewComment("");
                } catch (err) {
                    console.error(err);
                    showToast('تعذر إرسال التعليق، حاول مرة أخرى.', 'error');
                } finally {
                    setIsCommenting(false);
                }
            };

            const handleCommentKeyDown = (e, ideaId) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleAddComment(ideaId);
                }
            };

            const openIdeaDetails = (id) => {
                setSelectedIdeaId(id);
                setActiveTab('idea-details');
            };

            const openProfile = (name, avatar, role, e) => {
                if (e) e.stopPropagation();
                setViewProfileData({ name, avatar: avatar || getAvatar(name), role: role || "عضو" });
                setActiveTab('profile');
            };

            const isMainTab = activeTab === 'home' || activeTab === 'leaderboard';
            const selectedIdea = useMemo(() => ideas.find(i => i.id === selectedIdeaId), [ideas, selectedIdeaId]);

            const StatusPill = ({ status }) => {
                const styles = { 'مكتمل': 'bg-emerald-50 text-emerald-700 border-emerald-100', 'جاري التنفيذ': 'bg-blue-50 text-blue-700 border-blue-100', 'قيد المراجعة': 'bg-amber-50 text-amber-700 border-amber-100' };
                const icons = { 'مكتمل': <CheckCircle2 size={14} />, 'جاري التنفيذ': <TrendingUp size={14} />, 'قيد المراجعة': <Clock size={14} /> };
                return <span className={`px-3 py-1 text-xs font-bold rounded-full border flex items-center gap-1.5 w-fit shadow-sm ${styles[status] || styles['قيد المراجعة']}`}>{icons[status]} {status}</span>;
            };

            const IdeaCardSkeleton = () => (
                <div className="bg-white/95 rounded-3xl border border-white/80 shadow-sm overflow-hidden p-5 md:p-7">
                    <div className="flex items-center gap-3 mb-4">
                        <div className="w-10 h-10 rounded-full skeleton"></div>
                        <div className="flex-1 space-y-2">
                            <div className="h-3 w-28 rounded skeleton"></div>
                            <div className="h-2.5 w-20 rounded skeleton"></div>
                        </div>
                    </div>
                    <div className="h-4 w-3/4 rounded skeleton mb-3"></div>
                    <div className="h-16 rounded-2xl skeleton mb-2"></div>
                    <div className="h-16 rounded-2xl skeleton"></div>
                </div>
            );

            return (
                <div dir="rtl" className="flex h-screen font-sans text-slate-800 overflow-hidden relative">

                    {/* Toast */}
                    {toast && (
                        <div role="status" aria-live="polite" className={`fixed top-20 md:top-4 left-1/2 -translate-x-1/2 z-[100] backdrop-blur-md text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 animate-pop-in ${toast.type === 'error' ? 'bg-red-600/95' : toast.type === 'info' ? 'bg-slate-700/95' : 'bg-slate-900/90'}`}>
                            {toast.type === 'error' ? <AlertCircle className="text-red-200 shrink-0" size={18} /> : <CheckCircle2 className="text-emerald-400 shrink-0" size={18} />}

                        {activeTab === 'profile' && viewProfileData && (
                            <div className="max-w-2xl mx-auto p-4 md:p-8">
                                <div className="bg-white/95 rounded-[2rem] p-8 text-center shadow-[0_8px_30px_rgb(0,32,96,0.04)] border border-white mt-10 relative animate-fade-in">
                                    {user && user.displayName === viewProfileData.name && (
                                        <button onClick={() => { auth.signOut(); setActiveTab('home'); showToast('تم تسجيل الخروج'); }} aria-label="تسجيل الخروج" className="absolute top-4 left-4 w-10 h-10 bg-slate-50 text-slate-400 hover:text-red-500 rounded-full flex items-center justify-center transition-colors">
                                            <LogOut size={18} />
                                        </button>
                                    )}
                                    <div className="w-28 h-28 mx-auto -mt-20 mb-4 rounded-full border-4 border-white shadow-xl overflow-hidden bg-slate-100 cursor-pointer active:scale-95 transition-transform" onClick={() => setFullScreenImage(viewProfileData.avatar)}>
                                        <img src={viewProfileData.avatar} loading="lazy" decoding="async" className="w-full h-full object-cover" alt={`صورة ${viewProfileData.name}`} />
                                    </div>
                                    <h2 className="text-2xl font-black text-[#002060] mb-1">{viewProfileData.name}</h2>
                                    <span className="inline-block px-3 py-1 bg-red-50 text-[#E30613] text-xs font-bold rounded-lg border border-red-100 mb-6">{viewProfileData.role}</span>

                                    <div className="grid grid-cols-2 gap-4 border-t border-slate-100 pt-6">
                                        <div className="bg-slate-50/80 p-4 rounded-2xl">
                                            <h4 className="text-sm text-slate-500 font-bold mb-1">الأفكار المطروحة</h4>
                                            <p className="text-2xl font-black text-[#002060]">{ideas.filter(i => i.author === viewProfileData.name).length}</p>
                                        </div>
                                        <div className="bg-orange-50/80 p-4 rounded-2xl">
                                            <h4 className="text-sm text-orange-600/70 font-bold mb-1">إجمالي الدعم</h4>
                                            <p className="text-2xl font-black text-orange-500">{ideas.filter(i => i.author === viewProfileData.name).reduce((sum, i) => sum + (i.upvotes || 0), 0)}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- صفحة أبطال الكيان --- */}
                        {activeTab === 'leaderboard' && (
                            <div className="max-w-3xl mx-auto p-4 md:p-8 mt-1 md:mt-0">
                                <div className="bg-[#002060] rounded-[2rem] p-8 md:p-10 text-center text-white mb-6 shadow-[0_20px_40px_rgb(0,32,96,0.15)] relative overflow-hidden border border-blue-800/50">
                                    <Award size={64} className="mx-auto text-yellow-400 mb-5 drop-shadow-xl relative z-10" />
                                    <h2 className="text-3xl font-black mb-2 relative z-10">أبطال YLY للتطوير</h2>
                                    <p className="text-blue-200 font-medium text-sm relative z-10">الأعضاء الأكثر تأثيراً في الكيان (محدث تلقائياً)</p>
                                </div>

                                {!ideasLoaded ? (
                                    <div className="space-y-2">{[1,2,3].map(n => <div key={n} className="h-16 rounded-2xl skeleton"></div>)}</div>
                                ) : topUsers.length === 0 ? (
                                    <div className="text-center py-10 bg-white/95 rounded-3xl border border-dashed border-slate-300">
                                        <p className="text-slate-500 font-medium text-sm">لا يوجد أبطال حتى الآن. اطرح فكرة لتكون الأول!</p>
                                    </div>
                                ) : (
                                    <div className="bg-white/95 rounded-[2rem] border border-white shadow-[0_8px_30px_rgb(0,32,96,0.04)] overflow-hidden p-2">
                                        {topUsers.map((usr, idx) => (
                                            <div key={usr.name} onClick={() => openProfile(usr.name, usr.avatar, usr.role)} className={`flex items-center p-3 mb-2 rounded-2xl cursor-pointer transition-colors ${idx === 0 ? 'bg-gradient-to-l from-amber-50/60 to-transparent border border-amber-100/50' : 'hover:bg-slate-50/80'}`}>
                                                <div className="w-10 text-center font-black text-xl">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}</div>
                                                <div className="flex-1 flex items-center gap-3 px-2 min-w-0">
                                                    <div className="w-10 h-10 bg-slate-100 rounded-full border-2 border-white overflow-hidden shrink-0">
                                                        <img src={usr.avatar} loading="lazy" decoding="async" alt="" className="w-full h-full object-cover" />
                                                    </div>
                                                    <div className="min-w-0">
                                                        <h4 className="font-bold text-slate-900 truncate">{usr.name}</h4>
                                                        <p className="text-[10px] font-bold text-[#E30613]">{usr.role}</p>
                                                    </div>
                                                </div>
                                                <div className="text-left pl-1 shrink-0">
                                                    <div className="bg-slate-50 text-slate-700 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 border border-slate-100">
                                                        <Flame size={14} className={idx < 3 ? "text-orange-500" : "text-slate-400"} /> {usr.score}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <div className="h-6" aria-hidden="true"></div>
                            </div>
                        )}

                        {/* --- صفحة Auth --- */}
                        {activeTab === 'auth' && (
                            <div className="max-w-md mx-auto p-4 md:p-8 mt-4">
                                <div className="bg-white/95 p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,32,96,0.04)] border border-white">
                                    <div className="flex justify-center mb-6">
                                        <div className="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center shadow-inner">
                                            <User size={32} className="text-[#002060]" />
                                        </div>
                                    </div>
                                    <h2 className="text-2xl font-black text-[#002060] text-center mb-2">
                                        {isLoginView ? 'تسجيل الدخول' : 'انضمام كعضو جديد'}
                                    </h2>
                                    <p className="text-center text-sm text-slate-500 mb-6 font-medium">
                                        {isLoginView ? 'مرحباً بعودتك إلى كايزن YLY' : 'شارك أفكارك وطور الكيان معنا'}
                                    </p>

                                    {authError && (
                                        <div role="alert" className="bg-red-50 border border-red-100 text-red-600 text-sm font-bold rounded-2xl p-3 mb-4 flex items-start gap-2 animate-fade-in">
                                            <AlertCircle size={16} className="shrink-0 mt-0.5" /><span>{authError}</span>
                                        </div>
                                    )}

                                    <form onSubmit={handleAuth} className="space-y-4">
                                        {!isLoginView && (
                                            <input type="text" placeholder="الاسم الرباعي (سيظهر للأعضاء)" value={authData.name} onChange={(e) => setAuthData({...authData, name: e.target.value})} className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:border-[#002060] outline-none bg-slate-50/50 text-sm font-bold transition-colors" required />
                                        )}

                                        <div className="flex items-stretch w-full rounded-2xl border border-slate-200 focus-within:border-[#002060] focus-within:ring-1 focus-within:ring-[#002060] transition-all bg-slate-50/50 overflow-hidden shadow-inner shadow-slate-100/50">
                                            <input type="tel" inputMode="numeric" placeholder="رقم الهاتف (بدون 0)" value={authData.phone} onChange={(e) => setAuthData({...authData, phone: e.target.value.replace(/\D/g, '').slice(0,10)})} className="flex-1 px-5 py-4 outline-none bg-transparent text-sm font-bold text-left" dir="ltr" required />
                                            <div className="flex items-center justify-center px-4 bg-slate-100/80 border-r border-slate-200 text-slate-500 font-bold text-sm" dir="ltr">
                                                +20
                                            </div>
                                        </div>

                                        <input type="password" placeholder="كلمة المرور (٦ أحرف على الأقل)" value={authData.password} onChange={(e) => setAuthData({...authData, password: e.target.value})} className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:border-[#002060] outline-none bg-slate-50/50 text-sm font-bold transition-colors" required minLength={6} />

                                        <button type="submit" disabled={authLoading} className="w-full bg-[#E30613] hover:bg-red-700 text-white py-4 rounded-2xl font-bold transition-all shadow-[0_8px_20px_rgb(227,6,19,0.2)] mt-2 flex items-center justify-center gap-2 disabled:opacity-70 active:scale-[0.99]">
                                            {authLoading && <span className="spinner"></span>}
                                            {authLoading ? 'برجاء الانتظار...' : (isLoginView ? 'دخول' : 'إنشاء حساب')}
                                        </button>
                                    </form>

                                    <div className="mt-6 text-center border-t border-slate-100 pt-6">
                                        <button onClick={() => { setIsLoginView(!isLoginView); setAuthError(''); }} className="text-sm font-bold text-slate-500 hover:text-[#E30613] transition-colors">
                                            {isLoginView ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Mobile Bottom Nav */}
                    {isMainTab && (
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-blue-900/5 flex justify-around items-center h-16 pb-safe z-30 px-2 shadow-[0_-10px_30px_rgb(0,32,96,0.03)]">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center justify-center w-20 h-full transition-colors ${activeTab === 'home' ? 'text-[#002060]' : 'text-slate-400'}`}>
                                <Home size={24} />
                                <span className="text-[10px] font-bold mt-1">الرئيسية</span>
                            </button>
                            <div className="relative -top-6">
                                <button onClick={() => requireAuth('add-idea')} aria-label="طرح فكرة جديدة" className="bg-[#E30613] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-[0_8px_20px_rgb(227,6,19,0.3)] border-[3px] border-[#F0F5FA] active:scale-90 transition-transform"><Plus size={28} /></button>
                            </div>
                            <button onClick={() => setActiveTab('leaderboard')} className={`flex flex-col items-center justify-center w-20 h-full transition-colors ${activeTab === 'leaderboard' ? 'text-[#002060]' : 'text-slate-400'}`}>
                                <Award size={24} />
                                <span className="text-[10px] font-bold mt-1">أبطال الكيان</span>
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<YlyKaizenApp />);
    </script>
</body>
</html>
