<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>نظام كايزن YLY | منصة التطوير المستمر</title>

    <!-- تسريع الاتصال المسبق بالخوادم -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <meta name="description" content="منصة كايزن YLY للتطوير المستمر. شارك أفكارك، حولها إلى واقع، وساهم في تطوير بيئة العمل.">
    <meta name="theme-color" content="#001845">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_thumb,w_64,h_64,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#002060', ylyred: '#E30613' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(6px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        popIn: { '0%': { opacity: 0, transform: 'scale(0.95) translateX(-50%)' }, '100%': { opacity: 1, transform: 'scale(1) translateX(-50%)' } },
                    },
                    animation: {
                        'fade-in': 'fadeIn .18s ease-out both',
                        'slide-up': 'slideUp .2s ease-out both',
                        'pop-in': 'popIn .18s ease-out both',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat (v9) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 antialiased selection:bg-[#002060] selection:text-white">

    <!-- شاشة التحميل -->
    <div id="loadingOverlay">
        <div class="spinner-box">
            <div class="modern-spinner"></div>
            <img src="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_thumb,w_100,h_100,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png" alt="YLY Logo" width="56" height="56">
        </div>
        <div class="loading-title">
            YLY <span>System</span>
        </div>
        <div class="loading-subtitle">جاري تأمين النظام وتهيئته...</div>
    </div>

    <div id="root"></div>

    <script type="text/babel" src="app.js"></script>

    <!-- كود إغلاق آمن لشاشة التحميل لضمان فتح الموقع فوراً دون انتظار -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) {
                    overlay.style.opacity = '0';
                    overlay.style.visibility = 'hidden';
                    setTimeout(() => overlay.remove(), 250);
                }
            }, 1200);
        });
    </script>
</body>
</html>
