    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#002060', ylyred: '#E30613' },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out', 'slide-up': 'slideUp 0.4s ease-out' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; scroll-behavior: smooth; }
        body { background-color: #F4F7FB; font-family: system-ui, -apple-system, sans-serif; }
        .spinner { width: 1.2rem; height: 1.2rem; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .75s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-navy selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons ---
        const Icon = ({ path, size=20, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: path }} />
        );
        const ICONS = {
            Home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
            Plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
            Board: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>',
            Award: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
            User: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
            BookOpen: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
            Target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
            TrendingUp: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
            CheckCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
            ArrowRight: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
            LogOut: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>'
        };

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyA3UqEDpP2Llt7ZkloqmlURGULdKEiWF3o",
            authDomain: "yly-2026.firebaseapp.com",
            projectId: "yly-2026",
            storageBucket: "yly-2026.firebasestorage.app",
            messagingSenderId: "599868603298",
            appId: "1:599868603298:web:f66010961895c707cb10fb"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const COMMITTEES = ['HR', 'PR', 'Media', 'OR', 'Events', 'Logistics', 'Communication', 'Training', 'Other'];
        
        // حساب نقاط كايزن بناءً على حالة الفكرة (Gamification System)
        const SCORE_MAP = {
            'submitted': 5,
            'under_review': 5,
            'approved': 20,
            'experiment': 30,
            'measuring': 30,
            'implemented': 50,
            'standardized': 75
        };

        const STATUS_STAGES = [
            { id: 'submitted', label: 'مُقدمة' },
            { id: 'under_review', label: 'قيد المراجعة' },
            { id: 'approved', label: 'مقبولة مبدئياً' },
            { id: 'experiment', label: 'جاري التجربة' },
            { id: 'measuring', label: 'قياس النتائج' },
            { id: 'implemented', label: 'تم التنفيذ' },
            { id: 'standardized', label: 'تم التعميم (Standard)' },
            { id: 'rejected', label: 'مرفوضة' }
        ];

        function KaizenMemberApp() {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [ideas, setIdeas] = useState([]);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [selectedIdea, setSelectedIdea] = useState(null);

            // Authentication Form State
            const [isLogin, setIsLogin] = useState(true);
            const [authData, setAuthData] = useState({ name: '', phone: '', password: '', committee: 'HR' });
            const [authLoading, setAuthLoading] = useState(false);

            // New Idea Form State
            const [newIdea, setNewIdea] = useState({ title: '', category: 'HR', problem: '', currentProcess: '', solution: '', expectedBenefit: '', difficulty: 'Medium', expectedImpact: 'High' });
            const [submitting, setSubmitting] = useState(false);

            const showToast = (msg, type='success') => { setToast({msg, type}); setTimeout(() => setToast(null), 3000); };

            // Fetch Auth & Data
            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        const doc = await db.collection('users').doc(u.uid).get();
                        if (doc.exists) setUserProfile(doc.data());
                    }
                });
                const unsubIdeas = db.collection('ideas').orderBy('createdAt', 'desc').onSnapshot(snap => {
                    setIdeas(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });
                return () => { unsubAuth(); unsubIdeas(); };
            }, []);

            // حساب النقاط والإحصائيات
            const myIdeas = ideas.filter(i => i.authorId === user?.uid);
            const myScore = myIdeas.reduce((sum, idea) => sum + (SCORE_MAP[idea.status] || 0), 0);
            const standardizedCount = ideas.filter(i => i.status === 'standardized').length;

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                const email = `${authData.phone}@yly.com`;
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, authData.password);
                    } else {
                        const res = await auth.createUserWithEmailAndPassword(email, authData.password);
                        await db.collection('users').doc(res.user.uid).set({
                            name: authData.name,
                            phone: authData.phone,
                            committee: authData.committee,
                            role: 'member',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    setActiveTab('dashboard');
                } catch (err) {
                    showToast('خطأ في بيانات الدخول', 'error');
                }
                setAuthLoading(false);
            };

            const submitKaizen = async (e) => {
                e.preventDefault();
                if (!user) return;
                setSubmitting(true);
                try {
                    await db.collection('ideas').add({
                        ...newIdea,
                        author: userProfile.name,
                        authorId: user.uid,
                        authorCommittee: userProfile.committee,
                        status: 'submitted', // مرحلة البداية
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast('تم رفع الفكرة بنجاح!');
                    setNewIdea({ title: '', category: 'HR', problem: '', currentProcess: '', solution: '', expectedBenefit: '', difficulty: 'Medium', expectedImpact: 'High' });
                    setActiveTab('board');
                } catch(e) { showToast('حدث خطأ', 'error'); }
                setSubmitting(false);
            };

            // Calculate Leaderboard based on points
            const leaderboard = useMemo(() => {
                const userStats = {};
                ideas.forEach(idea => {
                    if(!userStats[idea.authorId]) {
                        userStats[idea.authorId] = { name: idea.author, committee: idea.authorCommittee, score: 0, ideasCount: 0 };
                    }
                    userStats[idea.authorId].score += (SCORE_MAP[idea.status] || 0);
                    userStats[idea.authorId].ideasCount += 1;
                });
                return Object.values(userStats).sort((a,b) => b.score - a.score).slice(0,10);
            }, [ideas]);

            const getStatusBadge = (status) => {
                const stage = STATUS_STAGES.find(s => s.id === status) || STATUS_STAGES[0];
                let color = 'bg-slate-100 text-slate-600';
                if(status === 'standardized') color = 'bg-purple-100 text-purple-700';
                else if(status === 'implemented') color = 'bg-emerald-100 text-emerald-700';
                else if(status === 'experiment' || status === 'measuring') color = 'bg-blue-100 text-blue-700';
                else if(status === 'approved') color = 'bg-amber-100 text-amber-700';
                else if(status === 'rejected') color = 'bg-red-100 text-red-700';
                return <span className={`px-2 py-0.5 rounded-md text-[10px] font-bold ${color}`}>{stage.label}</span>;
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-navy">
                        <div className="bg-white p-6 rounded-3xl w-full max-w-sm shadow-xl animate-fade-in">
                            <div className="text-center mb-6">
                                <h1 className="text-2xl font-black text-navy tracking-tight">KAIZEN<span className="text-ylyred"> YLY</span></h1>
                                <p className="text-xs text-slate-500 mt-1 font-medium">نظام التطوير المستمر - Continuous Improvement</p>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-4">
                                {!isLogin && (
                                    <>
                                        <input type="text" placeholder="الاسم الرباعي" required value={authData.name} onChange={e=>setAuthData({...authData, name: e.target.value})} className="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-navy" />
                                        <select value={authData.committee} onChange={e=>setAuthData({...authData, committee: e.target.value})} className="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-navy">
                                            {COMMITTEES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </>
                                )}
                                <input type="tel" placeholder="رقم الهاتف" required value={authData.phone} onChange={e=>setAuthData({...authData, phone: e.target.value})} className="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-navy" />
                                <input type="password" placeholder="كلمة المرور" required value={authData.password} onChange={e=>setAuthData({...authData, password: e.target.value})} className="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-navy" />
                                <button type="submit" disabled={authLoading} className="w-full bg-navy hover:bg-blue-900 text-white font-bold py-3 rounded-xl transition-all shadow-md flex justify-center items-center">
                                    {authLoading ? <span className="spinner"></span> : (isLogin ? 'دخول النظام' : 'إنشاء حساب')}
                                </button>
                            </form>
                            <p className="text-center mt-4 text-xs font-bold text-slate-500 cursor-pointer" onClick={() => setIsLogin(!isLogin)}>
                                {isLogin ? 'عضو جديد؟ سجل هنا' : 'لديك حساب؟ سجل دخول'}
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-[#F4F7FB] relative overflow-hidden">
                    {/* Toast */}
                    {toast && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-white text-xs font-bold shadow-lg animate-fade-in ${toast.type==='error'?'bg-red-500':'bg-emerald-500'}`}>
                            {toast.msg}
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white px-5 py-4 flex justify-between items-center shadow-sm z-10 sticky top-0">
                        {activeTab === 'details' ? (
                            <button onClick={() => setActiveTab('board')} className="flex items-center gap-2 text-slate-600 font-bold text-sm">
                                <Icon path={ICONS.ArrowRight} /> عودة للوحة
                            </button>
                        ) : (
                            <div>
                                <h1 className="font-black text-navy text-lg leading-none">KAIZEN <span className="text-ylyred">YLY</span></h1>
                                <p className="text-[10px] text-slate-400 font-bold mt-1">Eastern Governorate Pilot</p>
                            </div>
                        )}
                        <button onClick={() => auth.signOut()} className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:text-ylyred transition-colors">
                            <Icon path={ICONS.LogOut} size={16} />
                        </button>
                    </header>

                    {/* Main Scrollable Area */}
                    <main className="flex-1 overflow-y-auto pb-24 px-4 pt-4 hide-scroll">
                        
                        {/* 1. Dashboard Tab */}
                        {activeTab === 'dashboard' && (
                            <div className="animate-fade-in space-y-4 max-w-xl mx-auto">
                                <div className="bg-navy rounded-3xl p-5 text-white shadow-lg relative overflow-hidden">
                                    <div className="absolute -right-4 -top-4 opacity-10"><Icon path={ICONS.Target} size={100} /></div>
                                    <h2 className="text-sm font-medium text-blue-200">مرحباً بك يا بطل الكايزن،</h2>
                                    <h3 className="text-xl font-black mt-1 mb-4">{userProfile?.name}</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-white/10 rounded-2xl p-3 border border-white/10 backdrop-blur-sm">
                                            <p className="text-[10px] text-blue-200 font-bold">نقاط التأثير الخاصة بك</p>
                                            <p className="text-2xl font-black text-white">{myScore} <span className="text-sm">نقطة</span></p>
                                        </div>
                                        <div className="bg-white/10 rounded-2xl p-3 border border-white/10 backdrop-blur-sm">
                                            <p className="text-[10px] text-blue-200 font-bold">أفكارك المطروحة</p>
                                            <p className="text-2xl font-black text-white">{myIdeas.length} <span className="text-sm">فكرة</span></p>
                                        </div>
                                    </div>
                                </div>

                                <h3 className="font-black text-navy text-sm px-1">نظرة عامة على الكيان</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col justify-center items-center text-center">
                                        <div className="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mb-2"><Icon path={ICONS.Board} /></div>
                                        <p className="text-2xl font-black text-slate-800">{ideas.length}</p>
                                        <p className="text-[10px] text-slate-500 font-bold mt-1">إجمالي الأفكار</p>
                                    </div>
                                    <div onClick={() => setActiveTab('library')} className="bg-gradient-to-br from-purple-600 to-indigo-700 rounded-2xl p-4 shadow-md text-white flex flex-col justify-center items-center text-center cursor-pointer active:scale-95 transition-transform">
                                        <div className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mb-2"><Icon path={ICONS.BookOpen} /></div>
                                        <p className="text-2xl font-black">{standardizedCount}</p>
                                        <p className="text-[10px] font-bold mt-1">أفكار تعممت (Standards)</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. Kaizen Board (Feed) */}
                        {activeTab === 'board' && (
                            <div className="animate-fade-in max-w-xl mx-auto space-y-3">
                                <h2 className="font-black text-navy text-base mb-3">لوحة الأفكار (Kaizen Board)</h2>
                                {loading ? <p className="text-center text-slate-400 text-xs">جاري التحميل...</p> : null}
                                {ideas.map(idea => (
                                    <div key={idea.id} onClick={() => { setSelectedIdea(idea); setActiveTab('details'); }} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/60 cursor-pointer active:scale-95 transition-transform animate-slide-up">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 className="font-bold text-navy text-sm leading-tight">{idea.title}</h3>
                                                <p className="text-[10px] text-slate-400 font-bold mt-1">{idea.author} • {idea.category}</p>
                                            </div>
                                            {getStatusBadge(idea.status)}
                                        </div>
                                        <p className="text-xs text-slate-600 line-clamp-2 mt-2 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                            <span className="font-bold text-slate-800 text-[10px] block mb-1">الكايزن المقترح:</span>
                                            {idea.solution}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 3. Kaizen Knowledge Library (Standardized Ideas Only) */}
                        {activeTab === 'library' && (
                            <div className="animate-fade-in max-w-xl mx-auto space-y-3">
                                <div className="bg-purple-100 border border-purple-200 p-4 rounded-2xl mb-4 text-center">
                                    <Icon path={ICONS.BookOpen} className="text-purple-600 mx-auto mb-2" size={28} />
                                    <h2 className="font-black text-purple-900 text-base">مكتبة الكايزن (Standards)</h2>
                                    <p className="text-[10px] text-purple-700 font-bold mt-1">هنا تجد أفضل الممارسات التي تم إثبات نجاحها وتعميمها على مستوى الكيان.</p>
                                </div>
                                {ideas.filter(i => i.status === 'standardized').map(idea => (
                                    <div key={idea.id} onClick={() => { setSelectedIdea(idea); setActiveTab('details'); }} className="bg-white rounded-2xl p-4 shadow-sm border border-purple-100 cursor-pointer">
                                        <h3 className="font-bold text-purple-900 text-sm leading-tight mb-1">{idea.title}</h3>
                                        <p className="text-[10px] text-slate-400 font-bold mb-3">{idea.authorCommittee}</p>
                                        <div className="flex justify-between items-center bg-slate-50 rounded-lg p-2 text-[10px] font-bold">
                                            <span className="text-slate-500">التأثير المستهدف: {idea.expectedImpact}</span>
                                            <span className="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">اضغط لرؤية النتائج</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 4. Idea Details & Timeline */}
                        {activeTab === 'details' && selectedIdea && (
                            <div className="animate-slide-up max-w-xl mx-auto">
                                <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/60 mb-4">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h2 className="text-lg font-black text-navy leading-tight">{selectedIdea.title}</h2>
                                            <p className="text-[11px] text-slate-500 font-bold mt-1.5">بواسطة: {selectedIdea.author} • {selectedIdea.category}</p>
                                        </div>
                                        {getStatusBadge(selectedIdea.status)}
                                    </div>

                                    {/* Idea Timeline */}
                                    <div className="mb-6 relative">
                                        <h4 className="text-[11px] font-black text-slate-400 mb-3 uppercase tracking-wider">مسار الفكرة (Workflow)</h4>
                                        <div className="flex justify-between items-center relative z-10 px-2">
                                            {['submitted', 'under_review', 'experiment', 'implemented', 'standardized'].map((step, idx, arr) => {
                                                const currentIdx = STATUS_STAGES.findIndex(s => s.id === selectedIdea.status);
                                                const stepIdx = STATUS_STAGES.findIndex(s => s.id === step);
                                                const isCompleted = currentIdx >= stepIdx;
                                                const isCurrent = currentIdx === stepIdx;
                                                const isRejected = selectedIdea.status === 'rejected';
                                                
                                                let bgColor = isCompleted ? 'bg-emerald-500' : 'bg-slate-200';
                                                if (isRejected) bgColor = 'bg-red-500';
                                                if (isCurrent && !isRejected) bgColor = 'bg-blue-500 ring-4 ring-blue-100';

                                                return (
                                                    <div key={step} className="flex flex-col items-center gap-1.5">
                                                        <div className={`w-4 h-4 rounded-full ${bgColor} z-10 shadow-sm transition-all duration-500`}></div>
                                                        <span className={`text-[8px] font-bold ${isCurrent ? 'text-blue-600' : 'text-slate-400'} text-center w-12 hidden sm:block`}>
                                                            {STATUS_STAGES.find(s=>s.id===step).label}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                            {/* Progress Line */}
                                            <div className="absolute top-2 left-4 right-4 h-0.5 bg-slate-200 -z-10">
                                                <div className="h-full bg-emerald-500 transition-all duration-1000" style={{ width: `${(STATUS_STAGES.findIndex(s => s.id === selectedIdea.status) / 6) * 100}%` }}></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="bg-red-50/50 p-3 rounded-2xl border border-red-100">
                                            <h4 className="text-[11px] font-black text-ylyred mb-1">الوضع الحالي (المشكلة)</h4>
                                            <p className="text-xs text-slate-700 font-medium leading-relaxed">{selectedIdea.currentProcess}</p>
                                        </div>
                                        <div className="bg-blue-50/50 p-3 rounded-2xl border border-blue-100">
                                            <h4 className="text-[11px] font-black text-blue-600 mb-1">الحل المقترح (الكايزن)</h4>
                                            <p className="text-xs text-slate-700 font-medium leading-relaxed">{selectedIdea.solution}</p>
                                        </div>

                                        {/* إذا كان هناك قياس مدخل من الإدارة يظهر هنا */}
                                        {selectedIdea.results && (
                                            <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 mt-4">
                                                <h4 className="text-[11px] font-black text-emerald-700 mb-3 flex items-center gap-1"><Icon path={ICONS.TrendingUp} size={14}/> نتائج القياس (Before / After)</h4>
                                                <div className="grid grid-cols-2 gap-2 text-center mb-2">
                                                    <div className="bg-white p-2 rounded-xl shadow-sm">
                                                        <span className="text-[10px] text-slate-400 font-bold block">قبل التجربة</span>
                                                        <span className="text-sm font-black text-red-500">{selectedIdea.results.before}</span>
                                                    </div>
                                                    <div className="bg-white p-2 rounded-xl shadow-sm">
                                                        <span className="text-[10px] text-slate-400 font-bold block">بعد التجربة</span>
                                                        <span className="text-sm font-black text-emerald-500">{selectedIdea.results.after}</span>
                                                    </div>
                                                </div>
                                                <div className="bg-emerald-600 text-white text-xs font-bold p-2 rounded-xl text-center">
                                                    نسبة التحسن: {selectedIdea.results.improvementPercentage}%
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 5. Submit Idea (Kaizen Form) - The core of the system */}
                        {activeTab === 'add' && (
                            <div className="animate-slide-up max-w-xl mx-auto">
                                <h2 className="font-black text-navy text-xl mb-1">طرح فكرة كايزن</h2>
                                <p className="text-xs text-slate-500 font-bold mb-5">تذكر: الهدف هو تحسين عملية حقيقية قابلة للقياس.</p>
                                
                                <form onSubmit={submitKaizen} className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/60 space-y-4">
                                    
                                    <div className="border-b border-slate-100 pb-4">
                                        <label className="text-[11px] font-black text-slate-700 block mb-1.5">عنوان الفكرة المبتكرة</label>
                                        <input required type="text" value={newIdea.title} onChange={e=>setNewIdea({...newIdea, title: e.target.value})} className="w-full bg-slate-50 border border-slate-200 px-3 py-2.5 rounded-xl text-xs font-bold outline-none focus:border-navy" placeholder="مثال: تحسين نظام الحضور.." />
                                    </div>

                                    <div className="border-b border-slate-100 pb-4">
                                        <label className="text-[11px] font-black text-ylyred block mb-1.5">ما هي العملية الحالية والمشكلة؟</label>
                                        <textarea required rows="3" value={newIdea.currentProcess} onChange={e=>setNewIdea({...newIdea, currentProcess: e.target.value})} className="w-full bg-red-50/30 border border-red-100 px-3 py-2.5 rounded-xl text-xs font-bold outline-none focus:border-ylyred resize-none" placeholder="اشرح كيف تتم العملية الآن وما هو الهدر فيها..."></textarea>
                                    </div>

                                    <div className="border-b border-slate-100 pb-4">
                                        <label className="text-[11px] font-black text-blue-600 block mb-1.5">ما هو الكايزن (الحل المقترح)؟</label>
                                        <textarea required rows="3" value={newIdea.solution} onChange={e=>setNewIdea({...newIdea, solution: e.target.value})} className="w-full bg-blue-50/30 border border-blue-100 px-3 py-2.5 rounded-xl text-xs font-bold outline-none focus:border-blue-600 resize-none" placeholder="خطوات التغيير المقترحة لجعلها أفضل..."></textarea>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 pb-2">
                                        <div>
                                            <label className="text-[11px] font-black text-slate-700 block mb-1.5">الفئة المعنية</label>
                                            <select value={newIdea.category} onChange={e=>setNewIdea({...newIdea, category: e.target.value})} className="w-full bg-slate-50 border border-slate-200 px-3 py-2.5 rounded-xl text-xs font-bold outline-none">
                                                {COMMITTEES.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-black text-slate-700 block mb-1.5">التأثير المتوقع</label>
                                            <select value={newIdea.expectedImpact} onChange={e=>setNewIdea({...newIdea, expectedImpact: e.target.value})} className="w-full bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-2.5 rounded-xl text-xs font-bold outline-none">
                                                <option value="High">عالي (High)</option>
                                                <option value="Medium">متوسط (Medium)</option>
                                                <option value="Low">منخفض (Low)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button type="submit" disabled={submitting} className="w-full bg-navy hover:bg-blue-900 text-white font-bold py-3 rounded-xl transition-all shadow-md flex justify-center items-center gap-2 mt-4">
                                        {submitting ? <span className="spinner"></span> : <><Icon path={ICONS.Plus} size={16} /> رفع الفكرة للمراجعة</>}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* 6. Leaderboard */}
                        {activeTab === 'leaderboard' && (
                            <div className="animate-fade-in max-w-xl mx-auto">
                                <div className="bg-gradient-to-br from-[#002060] to-blue-800 rounded-3xl p-6 shadow-lg text-center text-white mb-6">
                                    <Icon path={ICONS.Award} size={40} className="mx-auto text-yellow-400 mb-2" />
                                    <h2 className="text-xl font-black">أبطال الكايزن</h2>
                                    <p className="text-xs font-medium text-blue-200 mt-1">يتم احتساب النقاط بناءً على تأثير الفكرة ووصولها للتنفيذ</p>
                                </div>
                                <div className="space-y-2">
                                    {leaderboard.map((u, idx) => (
                                        <div key={idx} className="bg-white rounded-2xl p-3 flex items-center shadow-sm border border-slate-100">
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-sm mr-3 ${idx===0?'bg-yellow-100 text-yellow-600':idx===1?'bg-slate-200 text-slate-600':idx===2?'bg-orange-100 text-orange-600':'bg-blue-50 text-blue-600'}`}>
                                                {idx + 1}
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="font-bold text-slate-800 text-sm">{u.name}</h3>
                                                <p className="text-[10px] text-slate-400 font-bold">{u.committee} • {u.ideasCount} أفكار</p>
                                            </div>
                                            <div className="text-left bg-emerald-50 px-3 py-1 rounded-xl border border-emerald-100">
                                                <p className="text-sm font-black text-emerald-600">{u.score}</p>
                                                <p className="text-[8px] font-bold text-emerald-500">نقطة تأثير</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Bottom Navigation for Mobile */}
                    <nav className="bg-white border-t border-slate-100 flex justify-between items-center h-16 px-6 pb-safe fixed bottom-0 left-0 right-0 z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
                        <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 w-12 ${activeTab==='dashboard'?'text-navy':'text-slate-400'}`}>
                            <Icon path={ICONS.Home} /> <span className="text-[9px] font-bold">الرئيسية</span>
                        </button>
                        <button onClick={()=>setActiveTab('board')} className={`flex flex-col items-center gap-1 w-12 ${activeTab==='board'?'text-navy':'text-slate-400'}`}>
                            <Icon path={ICONS.Board} /> <span className="text-[9px] font-bold">اللوحة</span>
                        </button>
                        
                        <div className="relative -top-5">
                            <button onClick={()=>setActiveTab('add')} className="bg-ylyred text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg border-4 border-[#F4F7FB] active:scale-90 transition-transform">
                                <Icon path={ICONS.Plus} size={24} />
                            </button>
                        </div>

                        <button onClick={()=>setActiveTab('leaderboard')} className={`flex flex-col items-center gap-1 w-12 ${activeTab==='leaderboard'?'text-navy':'text-slate-400'}`}>
                            <Icon path={ICONS.Award} /> <span className="text-[9px] font-bold">الأبطال</span>
                        </button>
                        <button onClick={()=>setActiveTab('library')} className={`flex flex-col items-center gap-1 w-12 ${activeTab==='library'?'text-navy':'text-slate-400'}`}>
                            <Icon path={ICONS.BookOpen} /> <span className="text-[9px] font-bold">المكتبة</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KaizenMemberApp />);
    </script>
</body>
</html>
